name: S1 account maintenance
on:
  push:
    branches: [ops-s1-20261123]
    paths: ['.github/workflows/s1-account-operation.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Run scoped operation on SMALL2
        env:
          SSHPASS: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || (sudo apt-get -qq update && sudo apt-get -qq install -y sshpass)
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no lowcymethodowcy@s3.small.pl 'cd "$HOME/lowcy-small2-20261023" && node -' <<'NODE'
          const fs=require('fs'),c=require('crypto'),bcrypt=require('bcryptjs'),{Client}=require('pg');
          const dir=process.env.HOME+'/.config/lowcy-small2/';
          const [peer,iv,data,tag]=["MCowBQYDK2VuAyEAaWbEHdtbNYUJ9IOWZhfST1Jav9iNsqWItR+i2gvUxzE=","LB3mqc/OA5QIIfLx","KNTM3xJeP6agG/2YZFBcIO5/q/YKJZqVnrelcfKZGuNus7rJmjRkofwvEDPBqRhbN4g2FKr1Kqhj/SpYzdFHfZ73","hE9/5OZlHIUT0FG9u2qWBQ=="].map(x=>Buffer.from(x,'base64'));
          const secret=c.diffieHellman({privateKey:c.createPrivateKey(fs.readFileSync(dir+'backup_x25519_private.pem')),publicKey:c.createPublicKey({key:peer,format:'der',type:'spki'})});
          const dec=c.createDecipheriv('aes-256-gcm',c.createHash('sha256').update(secret).digest(),iv);dec.setAuthTag(tag);
          const input=JSON.parse(Buffer.concat([dec.update(data),dec.final()]));
          const url=JSON.parse(fs.readFileSync(dir+'runtime.json')).DATABASE_URL;
          if(new URL(url).hostname!=='pgsql3.small.pl'||new URL(url).pathname!=='/p1828_lowcy_kop')throw Error('Wrong target');
          const db=new Client({connectionString:url});
          (async()=>{await db.connect();try{
           await db.query('begin isolation level serializable');
           for(const [i,[first,last,phone]] of input.entries()){
            const r=await db.query("select id,phone from users where lower(trim(first_name))=lower($1) and lower(trim(last_name))=lower($2) and role='PLAYER' and archived_at is null for update",[first,last]);if(r.rowCount!==1)throw Error('identity '+i);
            const u=r.rows[0];const conflicts=await db.query("select id from users where right(regexp_replace(phone,'[^0-9]','','g'),9)=$1 and id<>$2 and (archived_at is null or phone=$1)",[phone,u.id]);if(conflicts.rowCount)throw Error('occupied '+i);
            console.log('BEFORE',i,u.phone===phone?'exact':String(u.phone).replace(/\D/g,'').endsWith(phone)?'formatted':'different');
            if(u.phone!==phone)await db.query("update users set phone=$1,auth_version=auth_version+1 where id=$2",[phone,u.id]);
           }
           await db.query('commit');console.log('VERIFIED_MAPPING');
           }finally{await db.end()}})().catch(e=>{console.error(e.code||e.message);process.exitCode=1;});
          NODE
