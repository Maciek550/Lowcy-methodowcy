name: MatchThis MT93 mobile classification cards - guarded SMALL2 release
'on':
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: [.github/workflows/matchthis-mt93-release.yml]
permissions: {contents: read, actions: read}
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild from verified SHA-locked production MT92 HTML (3 roles)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p matchthis/mt93-source
          gh run download 44255173415 -R Maciek550/Lowcy-methodowcy -n MatchThis_MT92_VERIFIED_LIVE_THREE_ROLE_HTML -D matchthis/mt93-source
          python3 matchthis/mt93-mobile-build.py
          python3 matchthis/mt93-build-deployment-scripts.py
          bash -n matchthis/mt93-deploy-small2.sh
          bash -n matchthis/mt93-rollback-small2.sh
      - name: Real Chromium and Firefox regression - selected button colors, tours, admin save/reload
        run: |
          set -Eeuo pipefail
          python3 -m venv /tmp/mt93-venv
          /tmp/mt93-venv/bin/pip install -q playwright
          /tmp/mt93-venv/bin/python -m playwright install --with-deps chromium firefox
          /tmp/mt93-venv/bin/python matchthis/mt93-mobile-regression.py
      - name: Atomic guarded UI-only SMALL2 release with MT92 rollback backup
        id: deploy
        env:
          SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: bash matchthis/mt93-deploy-small2.sh
      - name: Live SMALL2 browser verification Chromium and Firefox, all viewports
        run: /tmp/mt93-venv/bin/python matchthis/mt93-live-regression.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MatchThis_MT93_VERIFIED_LIVE_THREE_ROLE_HTML
          path: matchthis/mt93-release/MatchThis_MT-93*.html
          if-no-files-found: error
      - name: Automatic UI-only rollback if verification fails (data untouched)
        if: failure() && steps.deploy.outcome == 'success'
        env:
          SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: bash matchthis/mt93-rollback-small2.sh

# MT93 results navigation: orange only for selected state, screen-only CSS.

# MT93 retry r2: atomic live style snapshot; new staging directory after verified rollback.
