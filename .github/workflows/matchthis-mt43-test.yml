name: MatchThis MT43 pre-release MAVER October and April 2025 validation
on:
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: ['.github/workflows/matchthis-mt43-test.yml']
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MT41 and MT42 baselines, then MT43 from source
        run: |
          set -euo pipefail
          python3 matchthis/build-mt41.py
          python3 matchthis/build-mt42.py
          python3 matchthis/build-mt43.py
      - name: Validate previous archives unchanged, 2025 source data, JS version and syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          d=Path('matchthis')
          for suffix in ('','_SEDZIA','_OGLADACZ'):
            old=(d/f'MatchThis_MT-42{suffix}.html').read_text()
            new=(d/f'MatchThis_MT-43{suffix}.html').read_text()
            assert all(x in new for x in ('<title>MatchThis MT-43</title>','aria-label="Wersja MT-43">MT-43','data-version="MT-43"', "const APP_VERSION='MT-43'"))
            for k in ('MATCHTHIS_ARCHIVE_2026','MATCHTHIS_STANDALONE_2026','MATCHTHIS_ARCHIVE_2025_MEGA_V'):
              exp=lambda s:s.split('const '+k+'=')[1].split(';\n')[0]
              assert exp(old)==exp(new),(suffix,k)
            for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',new,re.S):
              Path('/tmp/check-mt43.js').write_text(script)
              subprocess.run(['node','--check','/tmp/check-mt43.js'],check=True)
          print('MT43_SOURCES_3_OF_3_VERSION_ARCHIVES_JS_PASS')
          PY
      - name: Install actual Chromium and Firefox
        run: |
          set -euo pipefail
          mkdir -p /tmp/mt43-browser && cd /tmp/mt43-browser
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium firefox
      - name: Click LIVE-origin browser UI with MT43 source for admin judge viewer
        run: |
          set -euo pipefail
          cd /tmp/mt43-browser
          node --input-type=module <<'JS'
          import {chromium,firefox} from 'playwright';
          import {readFile} from 'node:fs/promises';
          const url='https://matchthis.lowcymethodowcy.smallhost.pl/';
          const base=process.env.GITHUB_WORKSPACE+'/matchthis/';
          let passed=0;
          for(const [engineName,engine] of [['Chromium',chromium],['Firefox',firefox]]){
            const browser=await engine.launch({headless:true});
            try {
              for(const [role,suffix] of [['admin',''],['judge','_SEDZIA'],['viewer','_OGLADACZ']]){
                const html=await readFile(base+'MatchThis_MT-43'+suffix+'.html','utf8');
                for(const width of [390,1366]){
                  const context=await browser.newContext({viewport:{width,height:900}});
                  const page=await context.newPage();page.setDefaultTimeout(15000);
                  const errors=[];page.on('pageerror',e=>errors.push(e.message));
                  await page.route(url+'panel.php',r=>r.fulfill({status:200,contentType:'text/html; charset=utf-8',body:html}));
                  await page.goto(url+'panel.php',{waitUntil:'domcontentloaded',timeout:45000});
                  if(await page.title()!=='MatchThis MT-43'||await page.locator('#appversion').innerText()!=='MT-43')throw Error('VERSION');
                  const data=await page.evaluate(()=>{
                    const oct=db.events.find(x=>x.id==='mt2025-maver-super-cup-oct');
                    const apr=db.events.find(x=>x.id==='mt2025-maver-super-cup-apr');
                    if(!oct||!apr)return {missing:true};
                    const r1=core.tourClassification(oct.rounds[0]);
                    const r2=core.tourClassification(oct.rounds[1]);
                    const final=core.eventClassification(oct);
                    return {missing:false,events:db.events.length,rounds:oct.rounds.length,first:r1.length,second:r2.length,final:final.rows.length,first10:r1.filter(x=>x.sector==='A').length,
                      first20:r1.filter(x=>x.sector==='B').length,first30:r1.filter(x=>x.sector==='C').length,
                      unknownSecond:r2.filter(x=>x.peg==null&&x.sector==='—').length,
                      secondA:r2.filter(x=>x.sector==='A').length,secondB:r2.filter(x=>x.sector==='B').length,secondC:r2.filter(x=>x.sector==='C').length,
                      secondPegs:r2.map(x=>x.peg).sort((a,b)=>a-b),
                      secondWinners:r2.filter(x=>x.place===1).map(x=>[x.competitorName,x.sector,x.peg,x.weightG]).sort((a,b)=>a[1].localeCompare(b[1])),
                      finalTop:final.rows.slice(0,3).map(x=>[x.competitorName,x.points,x.weightG,x.rank]),
                      firstNostart:oct.rounds[0].results.filter(x=>x.peg===null).length,
                      z:apr.rounds[0].results.find(x=>x.peg===14&&x.weightG===2975)?.officialPlace,
                      p:apr.rounds[0].results.find(x=>x.peg===17&&x.weightG===2880)?.officialPlace,
                      thirdTour:db.cycles.find(c=>c.id==='mt2026-mega-match-this-cup-cycle')?.tours.find(t=>t.date==='2026-05-23')?.results.filter(x=>!x.absent).length
                    };
                  });
                  if(data.missing||data.rounds!==2||data.first!==32||data.second!==32||data.final!==32||data.first10!==10||data.first20!==10||data.first30!==10||data.unknownSecond!==0||data.secondA!==11||data.secondB!==10||data.secondC!==11||data.secondPegs.length!==32||data.secondPegs.some((x,i)=>x!==i+1)||data.firstNostart!==2||data.z!==5||data.p!==6||data.thirdTour!==28)throw Error('DATA_'+JSON.stringify(data));
                  if(JSON.stringify(data.secondWinners)!==JSON.stringify([['RZEPCZYŃSKI MARCIN','A',2,14420],['KOŁAKOWSKI KONRAD','B',21,15000],['BIEŃ PAWEŁ','C',23,15000]]))throw Error('SECOND_ROUND_WINNERS_'+JSON.stringify(data.secondWinners));
                  if(JSON.stringify(data.finalTop)!==JSON.stringify([
                     ['KOŁAKOWSKI KONRAD',3,20890,1],['RZEPCZYŃSKI MARCIN',5,23210,2],['BIEŃ PAWEŁ',6,23220,3]
                  ]))throw Error('FINAL_TOP_'+JSON.stringify(data.finalTop));
                  if(role!=='viewer'&&width===1366){
                    await page.evaluate(()=>{
                      const older=JSON.parse(JSON.stringify(db));
                      const e=older.events.find(x=>x.id==='mt2025-maver-super-cup-oct');
                      for(const r of e.rounds[1].results){r.peg=null;r.sector=null;}
                      localStorage.setItem('matchthis-preview-MT-42',JSON.stringify(older));
                      localStorage.removeItem('matchthis-preview-MT-43');
                    });
                    await page.reload({waitUntil:'domcontentloaded'});
                    const migration=await page.evaluate(()=>{
                      const e=db.events.find(x=>x.id==='mt2025-maver-super-cup-oct');
                      const a=e.rounds[1].results;
                      const stored=JSON.parse(localStorage.getItem('matchthis-preview-MT-43'));
                      return {nonNull:a.filter(x=>x.peg!=null&&x.sector!=null).length,stored:stored.events.find(x=>x.id===e.id).rounds[1].results.filter(x=>x.peg!=null&&x.sector!=null).length};
                    });
                    if(migration.nonNull!==32||migration.stored!==32)throw Error('MT42_STORAGE_MIGRATION_'+JSON.stringify(migration));
                  }
                  await page.locator('#nav [data-view="archive"]').click();
                  const year=page.locator('details[data-year="2025"]');
                  if(await year.getAttribute('open')===null)await year.locator('summary').click();
                  await page.locator('[data-open="mt2025-maver-super-cup-oct"]').click();
                  await page.locator('[data-result-mode="round"]').first().click();
                  const overall=page.locator('table.round-result tbody tr');
                  if(await overall.count()!==32)throw Error('VISIBLE_ROUND_ROWS_'+await overall.count());
                  await page.reload({waitUntil:'domcontentloaded'});
                  if((await page.evaluate(()=>db.events.filter(x=>x.id==='mt2025-maver-super-cup-oct').length))!==1)throw Error('RELOAD_LOST_OR_DUPLICATED');
                  if(width===390){
                    const dim=await page.evaluate(()=>({w:innerWidth,scroll:document.documentElement.scrollWidth}));
                    if(dim.scroll>dim.w+1)throw Error('HORIZONTAL_OVERFLOW_'+JSON.stringify(dim));
                  }
                  if(errors.length)throw Error('JS_PAGE_ERRORS_'+errors.join('|'));
                  await context.close();passed++;
                  console.log('PASS_MT43_BROWSER',engineName,role,width,'OCT_32 APR_5_6 PERSIST');
                }
              }
            }finally{await browser.close();}
          }
          if(passed!==12)throw Error('INCOMPLETE_TESTS_'+passed);
          console.log('MATCHTHIS_MT43_BROWSER_12_OF_12_PASSED');
          JS
