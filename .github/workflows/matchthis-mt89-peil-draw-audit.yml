name: MatchThis MT89 read-only PEIL references in published draws
'on':
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: [.github/workflows/matchthis-mt89-peil-draw-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read-only audit of PEIL identifier references in published draws
        env:
          SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          mkdir -p "$HOME/.ssh";chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256|awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 lowcymethodowcy@s3.small.pl 'bash -s' <<'REMOTE'
          python3 - <<'PY'
          from pathlib import Path
          import json,collections
          base=Path.home()/'domains/matchthis.lowcymethodowcy.smallhost.pl/public_html/.mt41-private'
          ids=('mt2026-person-peil-anna','mt2025-float_king_2025-person-60')
          paths={}
          for name in ('mt60-published-draws.json','state-mt73.json'):
           p=base/name
           d=json.loads(p.read_text())
           matches=collections.defaultdict(list)
           def scan(x,path='$'):
            if isinstance(x,dict):
             for k,v in x.items():
              if k in ids:matches[k].append(path+'/{key:'+k+'}')
              scan(v,path+'/'+str(k))
            elif isinstance(x,list):
             for i,v in enumerate(x):scan(v,path+'/'+str(i))
            elif isinstance(x,str) and x in ids:matches[x].append(path)
           scan(d)
           for k,locs in matches.items():
            print('PEIL_REF',name,k,'total',len(locs),'paths',locs[:35],flush=True)
           print('PEIL_FILE_SHAPE',name,'topType',type(d).__name__,'topKeys',list(d)[:15] if isinstance(d,dict) else len(d),flush=True)
          print('PEIL_DRAW_READ_ONLY_AUDIT_COMPLETE')
          PY
          REMOTE
