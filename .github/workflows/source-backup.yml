name: Lowcy Source Backup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build source ZIP
        run: |
          zip -r lowcy-source.zip . -x '.git/*' 'node_modules/*' '*.zip'
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: lowcy-source
          path: lowcy-source.zip
          retention-days: 30
