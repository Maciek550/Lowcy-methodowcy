name: SMALL2 Railway backup cron and volume read-only status
on:
  push:
    branches: [small2-preflight-v311-20261104]
    paths: ['.github/workflows/small2-railway-source-status.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Read deployment availability and mounted backup volume without changing Railway
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_API_TOKEN"
          node <<'NODE'
          const projectId='a1cb25a7-9ef3-4ee5-af9e-efafecf527ed';
          const environmentId='193be84b-d9f4-49bf-8a75-f432c8dda992';
          const query='query($projectId:String!,$environmentId:String!){environment(id:$environmentId,projectId:$projectId){serviceInstances{edges{node{id serviceId serviceName cronSchedule latestDeployment{status deploymentStopped} activeDeployments{id status deploymentStopped}}}} volumeInstances{edges{node{id serviceId mountPath state volume{id name}}}}}}';
          (async()=>{
            const response=await fetch('https://backboard.railway.com/graphql/v2',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+process.env.RAILWAY_API_TOKEN},body:JSON.stringify({query,variables:{projectId,environmentId}}),signal:AbortSignal.timeout(20000)});
            const data=await response.json();
            if(data.errors?.length) throw Error('QUERY_ERRORS '+data.errors.map(e=>e.extensions?.code).join(','));
            const env=data.data?.environment;
            const ids=['d24be1aa-b0d0-45cb-aee0-e867add813e0','b45540b3-3201-4991-bd11-987cd1c68963'];
            for(const sid of ids){const s=env.serviceInstances.edges.find(x=>x.node.serviceId===sid)?.node;if(!s)throw Error('NOT_FOUND');console.log('SERVICE_STATE '+JSON.stringify({name:s.serviceName,serviceId:s.serviceId,instanceId:s.id,cron:!!s.cronSchedule,latestStatus:s.latestDeployment?.status,latestStopped:s.latestDeployment?.deploymentStopped,activeCount:s.activeDeployments?.length,active:s.activeDeployments?.map(x=>({status:x.status,stopped:x.deploymentStopped}))}));}
            const v=env.volumeInstances.edges.find(x=>x.node.volume.id==='9247c5e9-fc58-43a2-b44d-64ffbc6be428')?.node;
            console.log('BACKUP_VOLUME_STATE '+JSON.stringify({id:v?.id,state:v?.state,attachedToService:v?.serviceId,mountPath:v?.mountPath}));
          })().catch(e=>{console.error('RAILWAY_STATUS_QUERY_FAILED '+e.message);process.exitCode=1});
          NODE
