name: MatchThis new-domain provider placeholder audit (read only)
on:
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: ['.github/workflows/matchthis-mt23-audit.yml']
permissions: { contents: read }
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - name: Read-only inspect new domain placeholder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 lowcymethodowcy@s3.small.pl 'bash -s' <<'EOSSH'
          set -euo pipefail
          d='matchthis.lowcymethodowcy.smallhost.pl'
          wd="$HOME/domains/$d/public_html"
          echo NEW_WEBSITE
          devil www list
          echo NEW_DOMAIN_DIRECTORY
          ls -lah "$wd"
          echo INDEX_HTML_SHA_SIZE_AND_FIRST_CHARS
          if test -f "$wd/index.html"; then
            sha256sum "$wd/index.html"
            wc -c "$wd/index.html"
            head -c 450 "$wd/index.html"
            echo ''
          fi
          echo NEW_PRIVATE_SOURCE_HASH
          sha256sum "$HOME/matchthis-independent/mt-23/MT-23.next"
          echo SOURCE_MARKER_EXISTS
          test -f "$HOME/matchthis-independent/MT23-OWNED" && echo yes || echo no
          EOSSH
      - name: Public DNS and HTTP checks
        shell: bash
        run: |
          set +e
          getent ahostsv4 matchthis.lowcymethodowcy.smallhost.pl | head -3
          curl -IL --max-time 12 http://matchthis.lowcymethodowcy.smallhost.pl/ | head -12
          curl -IL --max-time 12 https://matchthis.lowcymethodowcy.smallhost.pl/ | head -12
