name: Import FLOAT KING 2024 on SMALL2
on:
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: [.github/workflows/matchthis-float-king-2024.yml]
permissions: {contents: read, actions: read}
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Spławikowo verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 44686860639 --repo Maciek550/Lowcy-methodowcy --interval 10 --exit-status
      - uses: actions/checkout@v4
      - name: Apply verified event and read back all results
        env:
          SSHPASS: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > ~/.ssh/known_hosts 2>/dev/null
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')" = SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password lowcymethodowcy@s3.small.pl 'python3 - "$HOME/domains/matchthis.lowcymethodowcy.smallhost.pl/public_html/.mt41-private"' < matchthis/import-float-king-2024.py
          curl -fsS 'https://matchthis.lowcymethodowcy.smallhost.pl/mt73-state.php?public=1' -o /tmp/live.json
          python3 - <<'PY'
          import runpy,json
          data=json.load(open('/tmp/live.json'))['data']
          event,new=runpy.run_path('matchthis/import-float-king-2024.py')['build'](data)
          assert event in data['events'] and not new
          PY
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              page=pw.chromium.launch().new_page(viewport={'width':1400,'height':960})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              url='https://matchthis.lowcymethodowcy.smallhost.pl/'
              def expose_history(route):
                  response=route.fetch()
                  html=response.text()
                  marker='function playerHistory(personId){'
                  assert html.count(marker)==1
                  route.fulfill(response=response,body=html.replace(marker,'window.readHistoryForTest=playerHistory;'+marker))
              page.route(url,expose_history)
              page.goto(url)
              page.wait_for_function("document.querySelector('#mt73-sync')?.textContent.includes('Dane z serwera')")
              page.locator('[data-view="archive"]').first.click()
              fold=page.locator('details[data-year="2024"]')
              if fold.get_attribute('open') is None: fold.locator('summary').click()
              fold.locator('[data-open="mt2024-float-king"]').first.click()
              page.locator('[data-result-mode="sectors"]').first.click()
              sectors=page.locator('.sector-title')
              assert sectors.count()==6
              for i,s in enumerate('ABCDEF'):
                  title=sectors.nth(i)
                  assert 'SEKTOR '+s in title.inner_text().upper()
                  rows=title.locator('xpath=following-sibling::*[1]').locator('tbody tr')
                  assert rows.count()==(10 if s=='F' else 11)
                  for j,color in enumerate(['rgb(249, 223, 226)','rgb(220, 232, 247)','rgb(220, 241, 226)']):
                      row=rows.nth(j)
                      assert ('podium-'+str(j+1)) in row.get_attribute('class')
                      styles=row.evaluate("(r)=>[...r.cells].map(e=>[getComputedStyle(e).backgroundColor,getComputedStyle(e).boxShadow,getComputedStyle(e).color])")
                      import re
                      colors=[tuple(map(int,c)) for c in re.findall(r'rgb\((\d+), (\d+), (\d+)\)',str(styles))]
                      assert any(c[[0,2,1][j]]>max(c[k] for k in range(3) if k!=[0,2,1][j]) for c in colors),styles
              data=page.request.get(url+'mt73-state.php?public=1').json()['data']
              results=next(x for x in data['events'] if x['id']=='mt2024-float-king')['rounds'][0]['results']
              for r in results:
                  hist=page.evaluate("(id)=>window.readHistoryForTest(id).find(e=>e.id==='mt2024-float-king')",r['competitorId'])
                  row=hist['rows'][0]
                  assert (row['sector'],row['peg'],row['weightG'],row['place'])==(r['sector'],r['peg'],r['weightG'],r['officialPlace'])
              assert not errors,errors
              print('65 player histories, 6 sectors, 18 podium colors verified')
          PY
