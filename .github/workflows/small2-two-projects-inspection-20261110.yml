name: SMALL2 two independent projects read-only inspection 20261110
on:
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: ['.github/workflows/small2-two-projects-inspection-20261110.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SSHPASS: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - name: Inspect server configuration without changing applications
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y sshpass
          mkdir -p -m 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password -o ConnectTimeout=20 lowcymethodowcy@s3.small.pl 'sh -s' <<'REMOTE'
          set -eu
          echo AUDIT_SERVER_TIME
          date '+%Y-%m-%dT%H:%M:%S %Z %z'
          echo AUDIT_DISK
          df -h "$HOME"
          echo AUDIT_CRON
          crontab -l 2>/dev/null | sed -E 's#(https?://)[^ ]+#URL_REDACTED#g' || true
          echo AUDIT_APP_DIRECTORIES
          for d in "$HOME/lowcy-small2-20261023" "$HOME/matchthis-independent" "$HOME/domains/matchthis.lowcymethodowcy.smallhost.pl/public_html" "$HOME/.private-lowcy-archives"; do
          test ! -d "$d" || du -sh "$d"
          done
          echo AUDIT_MATCHTHIS_PRIVATE_FILE_NAMES
          find "$HOME/domains/matchthis.lowcymethodowcy.smallhost.pl/public_html/.mt41-private" -maxdepth 2 -type f -exec stat -f '%Sp %z %N' {} \; 2>/dev/null || true
          echo AUDIT_BACKUP_FILES
          find "$HOME/.private-lowcy-archives" -maxdepth 3 -type f -name '*zip' -exec stat -f '%Sp %z %N' {} \; 2>/dev/null || true
          echo AUDIT_MATCHTHIS_STORAGE_CODE
          find "$HOME/domains/matchthis.lowcymethodowcy.smallhost.pl/public_html" -maxdepth 2 -type f -name '*.php' -exec grep -nE 'sqlite:|new PDO|file_put_contents|fopen|__DIR__|dbname' {} \; | head -n 65
          echo AUDIT_CURRENT_FULL_BACKUPS
          for project in lowcy matchthis; do
            vault="$HOME/.private-project-backups/$project"
            if [ ! -d "$vault" ]; then echo "FULL_BACKUP_MISSING_VAULT $project"; exit 20; fi
            latest=$(find "$vault" -mindepth 2 -maxdepth 2 -type f -name backup.tar.gz | sort | tail -1)
            if [ -z "$latest" ] || [ ! -s "$latest" ]; then echo "FULL_BACKUP_MISSING_ARCHIVE $project"; exit 21; fi
            dir=$(dirname "$latest")
            count=$(find "$vault" -mindepth 2 -maxdepth 2 -type f -name backup.tar.gz | wc -l | tr -d ' ')
            echo "FULL_BACKUP_CURRENT $project count=$count bytes=$(stat -f '%z' "$latest")"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            gzip -t "$latest"
            tar -tzf "$latest" >/dev/null
            echo "FULL_BACKUP_VERIFIED $project"
          done
          echo AUDIT_COMPLETE
          REMOTE


      - name: MatchThis exported draw fingerprint compare (read-only)
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request
          url='https://matchthis.lowcymethodowcy.smallhost.pl/mt60-draws.php'
          with urllib.request.urlopen(url,timeout=30) as response:
            assert response.status==200
            published=json.load(response).get('draws',[])
          assert isinstance(published,list)
          expected={0:'333b54b2b8d5fccefebea13aa14a20e64f391fac564123c0c7ef344613fa3b68',
                    1:'b1104022ee45233164954348252308efeea9ea34dfc54c9dd73f64d93b9f0a9f'}
          target='mt2026-xiv-puchar-matchthis-28-29-nov'
          for ri,digest in expected.items():
            found=[x for x in published if x.get('eventId')==target and x.get('roundIndex')==ri]
            assert len(found)==1,('PUBLISHED_ROUND_MISSING_OR_AMBIGUOUS',ri,len(found))
            rows=found[0].get('rows')
            assert isinstance(rows,list)
            subset=sorted([{'competitorId':r['competitorId'],'competitorName':r['competitorName'],'peg':r['peg'],'sector':r['sector']} for r in rows],key=lambda x:x['competitorId'])
            result=hashlib.sha256(json.dumps(subset,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
            print('MT70_XIV_TOUR_PUBLISHED_COMPARE',ri+1,'rows',len(rows),'equal_to_browser_export',result==digest)
          print('MATCHTHIS_LIVE_DRAW_COMPARE_READONLY_COMPLETE')
          PY
