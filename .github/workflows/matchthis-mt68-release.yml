    - name: Build exact MT68 from MT67 and validate all three roles with rollback to MT67
      run: |
        set -euo pipefail
        test -f AGENTS.md
        python3 matchthis/build-mt68.py
        python3 - <<'PY'
        from pathlib import Path
        import hashlib,re
        D=Path('matchthis')
        versions={
         '':'00a8723e9ef9efaf47c6a19d27b30c4315d4c6012a5bc90bc1e9ed9247146f7c',
         '_OGLADACZ':'5d85a7215413e010078f83faea3650f16c99bb4178f11ea49dec7b2b17a823d3',
         '_SEDZIA':'c513e98b696837e847b22584bbb4d5c237196f2bc85ebb4fdcb60320e3940a08'
        }
        for role,sha in versions.items():
          file=D/f'MatchThis_MT-68{role}.html'
          s=file.read_text('utf8')
          assert hashlib.sha256(file.read_bytes()).hexdigest()==sha,('MT68 exact source mismatch',role)
          for marker in ('<title>MatchThis MT-68</title>', 'data-version="MT-68"',
             'aria-label="Wersja MT-68">MT-68',"const APP_VERSION='MT-68';",
             "const STORAGE_KEY='matchthis-preview-MT-68';",'function mt68TourLabel(', 'function mt68TourDayDate('):
            assert marker in s,(role,marker)
          assert 'function mt67DownloadAllDrawSectors' in s or 'mt67DownloadAllDrawSectors' in s
          assert 'function mt66BulkConfirm' in s
          assert 'function datedTourLabel(tour,entity){return mt68TourLabel(tour,entity);}' in s
          print('MT68_VERSION_DATA_FUNCTIONS_JS_CHECK_PASS',role)
        for kind in ('deploy','rollback'):
          source=(D/f'{kind}-mt67-small2.sh').read_text('utf8')
          for old,new in (
           ('MT-67','MT-68'),('MT67','MT68'),('mt67','mt68'),('mt-67','mt-68'),
           ('MT-66','MT-67'),('MT66','MT67'),('mt66','mt67'),('mt-66','mt-67')
          ):source=source.replace(old,new)
          assert 'index-MT67.backup' in source,kind
          assert 'matchthis-independent/mt-68' in source,kind
          assert 'MatchThis_MT-68_OGLADACZ.html' in source,kind
          assert ('MT68_VERSION_AUTH_HTTPS_OK' in source if kind=='deploy' else 'MT68_ROLLBACK_MT67' in source),kind
          (D/f'{kind}-mt68-small2.sh').write_text(source,'utf8')
        print('MT68_MT67_BACKUP_ROLLBACK_READY')
        PY
        bash -n matchthis/deploy-mt68-small2.sh
        bash -n matchthis/rollback-mt68-small2.sh
    - name: Deploy only MatchThis MT68 HTML, leave API, DB, published draws and history untouched
      id: deploy
      run: bash matchthis/deploy-mt68-small2.sh
    - name: Install Playwright Chromium and Firefox
      run: |
        mkdir -p /tmp/mt68-live && cd /tmp/mt68-live
        npm init -y >/dev/null
        npm install --silent playwright
        npx playwright install --with-deps chromium firefox
    - name: Test live unauthenticated buttons, historical dates, headings, source preservation and admin exports in Chromium and Firefox
      run: |
        set -euo pipefail
        cd /tmp/mt68-live
        node --input-type=module <<'JS'
        import {chromium,firefox} from 'playwright';
        import fs from 'node:fs';
        const url='https://matchthis.lowcymethodowcy.smallhost.pl/';
        const eventId='mt2026-xiv-puchar-matchthis-28-29-nov';
        const admin=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/matchthis/MatchThis_MT-68.html','utf8');
        for(const [name,engine] of [['Chromium',chromium],['Firefox',firefox]]){
          const browser=await engine.launch({headless:true});
          try{
            const ctx=await browser.newContext({viewport:{width:1366,height:900}});
            const page=await ctx.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const r=await page.goto(url,{waitUntil:'networkidle',timeout:50000});
            if(r.status()!==200||await page.title()!=='MatchThis MT-68'||(await page.locator('#appversion').innerText())!=='MT-68')
              throw Error(name+' LIVE_VERSION_FAILED');
            const dates=await page.evaluate(()=>{
              const e=db.events.find(mt52IsXiv);
              const rounds=getRounds(e);
              const d1=mt68TourLabel(rounds[0],e,0),d2=mt68TourLabel(rounds[1],e,1);
              const cy=db.cycles.find(x=>getRounds(x).some(t=>t.date==='2026-03-28'));
              const archived=cy?mt68TourLabel(getRounds(cy).find(t=>t.date==='2026-03-28'),cy):'';
              const missing=mt68TourLabel({name:'1. tura',date:''},{rounds:[{name:'1. tura',date:''},{name:'2. tura',date:''}]},0);
              return {d1,d2,archived,missing};
            });
            if(dates.d1!=='TURA 1 · SOBOTA 28.11.2026'||dates.d2!=='TURA 2 · NIEDZIELA 29.11.2026'||
               dates.archived!=='TURA 1 · SOBOTA 28.03.2026'||dates.missing!=='TURA 1 · DATA NIEPOTWIERDZONA')
              throw Error(name+' ROUND_DATE_FORMAT_'+JSON.stringify(dates));
            await page.locator('[data-view="events"]').first().click();
            await page.locator('[data-open="'+eventId+'"]').first().click();
            const text1=await page.locator('[data-round="0"]').first().innerText();
            const text2=await page.locator('[data-round="1"]').first().innerText();
            if(!text1.includes('TURA 1')||!text1.includes('SOBOTA 28.11.2026')||
               !text2.includes('TURA 2')||!text2.includes('NIEDZIELA 29.11.2026'))
              throw Error(name+' REAL_BUTTONS_WRONG '+JSON.stringify([text1,text2]));
            await page.locator('[data-result-mode="publishedDraw"]').first().click();
            const strip=await page.locator('.mt61-round-status').first().innerText();
            if(!strip.includes('TURA 1 · SOBOTA 28.11.2026')||
               !strip.includes('TURA 2 · NIEDZIELA 29.11.2026'))
              throw Error(name+' PUBLIC_DRAW_STRIP_WRONG '+strip);
            if(await page.locator('[data-action="mt67DownloadAllDrawSectors"]').count())
              throw Error(name+' PUBLIC_VIEWER_EXPORT_FORBIDDEN');
            const api=await page.evaluate(async()=>{
              const r=await fetch('/mt60-draws.php',{cache:'no-store',credentials:'omit'});
              const json=await r.json();return {status:r.status,count:json.draws.length};
            });
            if(api.status!==200)throw Error(name+' PUBLIC_API_NOT_AVAILABLE');
            await page.screenshot({path:'/tmp/mt68-live/MT68_'+name+'_public_viewer.png',fullPage:true});
            await ctx.close();
            // Isolated admin simulation: no authenticated production writes.
            const isolated=await browser.newContext({viewport:{width:1366,height:900},acceptDownloads:true});
            await isolated.addInitScript(()=>{
              const store={};
              Object.defineProperty(window,'localStorage',{configurable:true,value:{
                getItem:k=>Object.hasOwn(store,k)?store[k]:null,
                setItem:(k,v)=>{store[k]=String(v)},removeItem:k=>delete store[k],
                clear:()=>{for(const k of Object.keys(store))delete store[k]},
                key:i=>Object.keys(store)[i]||null,get length(){return Object.keys(store).length}
              }});
            });
            const adminPage=await isolated.newPage();
            adminPage.on('pageerror',e=>errors.push(e.message));
            await adminPage.route('**/mt68-isolated-test.html',route=>route.fulfill({status:200,contentType:'text/html',body:admin}));
            await adminPage.goto(url+'mt68-isolated-test.html',{waitUntil:'load',timeout:60000});
            const ui=await adminPage.evaluate(()=>{
              const e=db.events.find(mt52IsXiv),t=getRounds(e)[0];
              page='event';selectedId=e.id;roundIndex=0;resultMode='draw';render();
              const people=e.entrantIds.map(findPlayer).filter(p=>p&&!p.isReservation);
              const pegs=Array.from({length:people.length},(_,i)=>i+1);
              const groups=mt56BalancedGroups(pegs,6);
              const sectors=new Map(groups.flatMap(g=>g.pegs.map(p=>[p,g.sector])));
              t.mt55SectorPlan={pegs,sectors:6,sizes:groups.map(g=>g.pegs.length)};
              t.mt55Entries=people.map((p,i)=>({competitorId:p.id,competitorName:fullName(p),peg:i+1,sector:sectors.get(i+1),weightG:null}));
              const record=[];const ctx=CanvasRenderingContext2D.prototype;
              const original=ctx.fillText;
              ctx.fillText=function(text,...args){record.push(String(text));return original.call(this,text,...args)};
              try{
                const rows=mt67DrawRows(t).filter(x=>x.sector==='A');
                mt67CanvasForSector(e,t,'A',rows);
              }finally{ctx.fillText=original}
              return {
                label:datedTourLabel(t,e), pngLabel:record.filter(x=>x.includes('TURA 1')).slice(-3),
                title:document.querySelector('#appversion')?.textContent,
                sectorCount:new Set(t.mt55Entries.map(x=>x.sector)).size,
                weightCount:t.mt55Entries.filter(x=>x.weightG!=null).length,
                confirmedFunction:typeof mt66BulkConfirm
              };
            });
            if(ui.label!=='TURA 1 · SOBOTA 28.11.2026'||
               !ui.pngLabel.some(x=>x==='TURA 1 · SOBOTA 28.11.2026')||
               ui.sectorCount!==6||ui.weightCount!==0||ui.confirmedFunction!=='function')
              throw Error(name+' ADMIN_FB_PDF_ROSTER_REGRESSION_'+JSON.stringify(ui));
            const download=adminPage.waitForEvent('download',{timeout:50000});
            await adminPage.locator('[data-action="mt67DownloadAllDrawSectors"]').first().click();
            const dl=await download;
            const path='/tmp/mt68-live/MT68_'+name+'_draws.zip';
            await dl.saveAs(path);
            const bytes=fs.readFileSync(path);
            if(bytes.subarray(0,4).toString('hex')!=='504b0304')throw Error(name+' ZIP_FORMAT_BROKEN');
            if(errors.length)throw Error(name+' BROWSER_ERRORS '+JSON.stringify(errors));
            console.log('MT68_LIVE_LABELS_WEEKDAYS_ARCHIVE_VIEWER_FB_ZIP_PASS',name,JSON.stringify({dates,api,ui,zipBytes:bytes.length,jsErrors:0}));
            await isolated.close();
          }finally{await browser.close();}
        }
        JS
    - name: Preserve verified MT68 roles and live screenshots
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MatchThis_MT-68_verified
        path: |
          matchthis/MatchThis_MT-68.html
          matchthis/MatchThis_MT-68_OGLADACZ.html
          matchthis/MatchThis_MT-68_SEDZIA.html
          /tmp/mt68-live/MT68_*_public_viewer.png
        if-no-files-found: error
    - name: Restore only MatchThis MT67 on failed production checks
      if: failure() && steps.deploy.outcome == 'success'
      run: bash matchthis/rollback-mt68-small2.sh
