name: MatchThis MT40 LIVE Chromium Firefox back/forward and ranking verification
on:
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: ['.github/workflows/matchthis-mt40-live.yml']
permissions: {contents: read}
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and Firefox
        run: |
          set -euo pipefail
          mkdir -p /tmp/mt40-live && cd /tmp/mt40-live
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium firefox
      - name: Verify public SMALL2 live actual UI and navigation
        run: |
          set -euo pipefail
          cd /tmp/mt40-live
          node --input-type=module <<'JS'
          import {chromium,firefox} from 'playwright';
          const base='https://matchthis.lowcymethodowcy.smallhost.pl/';
          let checks=0;
          for(const [name,engine] of [['Chromium',chromium],['Firefox',firefox]]){
            const browser=await engine.launch({headless:true});
            try{
              for(const width of [390,1366]){
                const ctx=await browser.newContext({viewport:{width,height:900}});
                const page=await ctx.newPage();
                page.setDefaultTimeout(16000);
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const resp=await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
                if(resp.status()!==200||await page.title()!=='MatchThis MT-40')throw Error('PUBLIC_WRONG_VERSION');
                if((await page.locator('#appversion').innerText())!=='MT-40')throw Error('VERSION_BAR');
                await page.locator('#nav [data-view="archive"]').click();
                const y=page.locator('details[data-year="2025"]');
                if(await y.getAttribute('open')===null)await y.locator('summary').click();
                await page.locator('[data-open="mt2025-splawikowo-dec07"]').click();
                await page.locator('[data-result-mode="round"]').first().click();
                const rows=page.locator('table.round-result tbody tr');
                const heads=await page.locator('table.round-result th').allInnerTexts();
                if(heads.length!==6||heads[0]!=='M. og.'||heads[2]!=='Pkt. sekt.')throw Error('OVERALL_HEADING '+JSON.stringify(heads));
                if(await rows.count()!==36)throw Error('LOST_2025_RESULTS');
                const rank=await rows.locator('td.overall-place-cell').allInnerTexts();
                if(rank.some((v,i)=>v!==String(i+1)))throw Error('RANKS_1_TO_36');
                const pts=await rows.locator('td.points-cell').allInnerTexts();
                if(pts.slice(0,4).join(',')!=='1,1,1,1')throw Error('SECTOR_SCORING_CHANGED');
                await page.reload({waitUntil:'domcontentloaded'});
                if(!await page.locator('table.round-result').count())throw Error('RELOAD_NAVIGATION_LOST');
                await page.goBack({timeout:16000});
                if((await page.evaluate(()=>resultMode))!=='sectors')throw Error('BROWSER_BACK_SKIPPED_SECTORS');
                await page.goForward({timeout:16000});
                if((await page.evaluate(()=>resultMode))!=='round')throw Error('BROWSER_FORWARD_WRONG');
                await page.locator('[data-nav-back]').click();
                await page.waitForFunction(()=>resultMode==='sectors');
                await page.goBack({timeout:16000});
                if((await page.evaluate(()=>page))!=='archive')throw Error('BROWSER_BACK_SKIPPED_ARCHIVE');
                await page.goBack({timeout:16000});
                if((await page.evaluate(()=>page))!=='home')throw Error('BROWSER_BACK_LEFT_APP');
                if(width===390){
                  await page.evaluate(()=>{document.body.style.zoom='1.5'});
                  const dims=await page.evaluate(()=>({page:document.documentElement.scrollWidth,width:innerWidth}));
                  if(dims.page>dims.width+1)throw Error('MOBILE_150_PERCENT_OVERFLOW '+JSON.stringify(dims));
                }
                const saved=await page.evaluate(()=>{
                  const c=db.cycles.find(c=>c.id==='mt2026-mega-match-this-cup-cycle');
                  const tour=c.tours.find(t=>t.date==='2026-05-23');
                  return tour.results.filter(r=>!r.absent).length;
                });
                if(saved!==28)throw Error('2026_THIRD_TOUR_NOT_PRESERVED');
                const ctl=page.locator('[data-action="export"],[data-action="downloadOverallPdf"]');
                if(await ctl.count()){
                  const exposed=await ctl.evaluateAll(els=>els.some(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;}));
                  if(exposed)throw Error('VIEWER_EXPORT_VISIBLE');
                }
                if(errors.length)throw Error('JS_CONSOLE_ERROR '+errors.join('; '));
                console.log('PASS_MT40_LIVE',name,width,'overall_1_36 back_forward_reload preserved_2025_2026');
                checks++;
                await ctx.close();
              }
            }finally{await browser.close()}
          }
          if(checks!==4)throw Error('SCENARIOS_MISSING '+checks);
          console.log('MATCHTHIS_MT40_LIVE_4_OF_4_PASSED');
          JS
