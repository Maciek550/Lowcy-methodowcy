name: MatchThis SMALL2 - readonly diagnosis T2, Foto FB and PDF
'on':
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: [.github/workflows/matchthis-mt85-readonly-diagnosis.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect actual MatchThis SMALL2 version and counts without modifying server
        env:
          SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get -qq update
          sudo apt-get -qq install -y sshpass
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > ~/.ssh/known_hosts 2>/dev/null
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256|awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 lowcymethodowcy@s3.small.pl 'bash -s' <<'READONLY'
          set -euo pipefail
          web="$HOME/domains/matchthis.lowcymethodowcy.smallhost.pl/public_html"
          echo "MATCHTHIS_READONLY_START"
          grep -o -m1 '<title>[^<]*' "$web/index.html" || true
          grep -o -m1 "mt[0-9][0-9]-admin.php" "$web/panel.php" || true
          sha256sum "$web/index.html"
          python3 - "$web/.mt41-private/state-mt73.json" <<'PY'
          from pathlib import Path
          import json,sys
          state=json.loads(Path(sys.argv[1]).read_text())
          data=state.get('data',{})
          print('state_revision',state.get('revision'),'event_count',len(data.get('events',[])))
          e=next((e for e in data.get('events',[]) if e.get('id')=='mt2026-xiv-puchar-matchthis-28-29-nov'),None)
          print('target_event_present',bool(e))
          if e:
           print('target_rounds',len(e.get('rounds',[])),'start_list_count',len(e.get('entrantIds',[])))
           for n,t in enumerate(e.get('rounds',[]),1):
            entries=t.get('mt55Entries',[]) or []
            results=t.get('results',[]) or []
            sectors={str(x.get('sector')) for x in entries if x.get('sector')}
            print('round',n,'status',t.get('status'),'draw_published',t.get('drawPublished'),'entries',len(entries),'entry_sector_count',len(sectors),'results',len(results),'positive_weights',sum(float(r.get('weightG') or 0)>0 for r in results),'zero_weights',sum(float(r.get('weightG') or 0)==0 for r in results))
            ids={str(x.get('competitorId')) for x in results}
            print('round',n,'assigned_without_result',sum(bool(x.get('sector')) and x.get('peg') is not None and str(x.get('competitorId')) not in ids for x in entries))
          PY
          echo "MATCHTHIS_READONLY_END"
          READONLY
