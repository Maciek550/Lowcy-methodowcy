name: "V299 Round choice readability"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v299-release.yml'
      - 'tools/v299_round_choice_readability.py'

permissions:
  contents: write

jobs:
  patch-test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Apply V299"
        run: python tools/v299_round_choice_readability.py
      - name: "Syntax check"
        run: |
          node --check server.cjs
          node --check app.js
          git diff --check
      - name: "Validate V299 copy"
        run: |
          grep -q "const APP_VERSION = '299';" server.cjs
          grep -q "V299_ROUND_CHOICE_READABILITY" server.cjs
          grep -q "V299_ROUND_CHOICE_READABILITY" app.js
          grep -q "Jedno losowanie, jedna tura wyników" server.cjs
          grep -q "Dwa losowania i dwie tury wyników" server.cjs
          grep -q "font-size:18px" server.cjs
          grep -q "font-size:15px" server.cjs
      - name: "Commit V299"
        run: |
          git config user.name "lowcy-v299-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.cjs app.js
          git commit -m "V299: explain one-round and two-round choices with larger text"
          git push
