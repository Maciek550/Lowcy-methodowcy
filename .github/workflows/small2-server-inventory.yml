name: SMALL2 authenticated read-only server inventory
on:
  push:
    branches: [small2-preflight-v311-20261104]
    paths: ['.github/workflows/small2-server-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - name: Setup pinned SSH host with correct fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get -qq update
          sudo apt-get -qq install -y sshpass
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
      - name: Diagnose WWW and database names without revealing passwords
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no \
            -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes \
            -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 lowcymethodowcy@s3.small.pl 'bash -s' <<'EOSSH'
          set +e
          echo '=== ACCOUNT ==='
          id -un
          pwd
          echo '=== DEVIL WWW LIST ==='
          devil www list
          echo '=== DEVIL PGSQL LIST ==='
          devil pgsql list
          echo '=== SOURCE DIR ==='
          src="$HOME/lowcy-small2-20261023"
          ls -ld "$src" "$src/server.cjs" "$src/app.js" "$src/package.json" "$src/node_modules" 2>&1
          git -C "$src" rev-parse HEAD
          git -C "$src" status --short | head -40
          echo '=== DOMAIN DIRS ==='
          find "$HOME/domains" -mindepth 1 -maxdepth 2 -type d 2>/dev/null | sort | head -70
          echo '=== ACTUAL PHP PUBLIC_HTML ENTRIES (NAMES, SIZE, TYPES ONLY) ==='
          find "$HOME/domains/lowcymethodowcy.smallhost.pl/public_html" -mindepth 1 -maxdepth 2 -exec ls -ld {} \; 2>/dev/null | head -50
          echo '=== WEB DOMAIN CURRENT TYPE ==='
          devil www list
          echo '=== CONFIG FILE PRESENCE (NO VALUES) ==='
          for f in "$src/.env" "$src/.env.production" "$HOME/.bash_profile" "$HOME/.pgpass"; do
            if test -f "$f"; then echo "$(basename "$f"): PRESENT"; else echo "$(basename "$f"): ABSENT"; fi
          done
          echo '=== EXPORTED VAR NAMES ONLY ==='
          if test -r "$HOME/.bash_profile"; then
            awk '/^[[:space:]]*export[[:space:]]+[A-Za-z_][A-Za-z0-9_]*=/{sub(/=.*/, "", $2); print $2}' "$HOME/.bash_profile" | sort -u
          fi
          echo '=== PG TOOL AVAILABILITY ==='
          command -v psql || true
          command -v pg_dump || true
          EOSSH
