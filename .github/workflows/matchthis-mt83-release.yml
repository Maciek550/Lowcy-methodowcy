name: MatchThis MT83 - restore admin home, zeros and PZW standings LIVE SMALL2
'on':
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: [.github/workflows/matchthis-mt83-release.yml]
permissions: {contents: read, actions: read}
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pretested MT83 (3 HTML), build guarded installer and verify versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mt83-tested /tmp/mt81-source
          gh run download 43860864818 -R Maciek550/Lowcy-methodowcy -n MT83_EXACT_THREE_ROLE_HTML_PREDEPLOY -D /tmp/mt83-tested
          gh run download 43845767710 -R Maciek550/Lowcy-methodowcy -n MatchThis_MT81_LINKS_NO_SCROLL_3_ROLE_HTML -D /tmp/mt81-source
          for role in '' '_OGLADACZ' '_SEDZIA'; do
            cp "$(find /tmp/mt83-tested -name "MatchThis_MT-83$role.html" -print -quit)" "matchthis/MatchThis_MT-83$role.html"
            cp "$(find /tmp/mt81-source -name "MatchThis_MT-81$role.html" -print -quit)" "matchthis/MatchThis_MT-81$role.html"
          done
          echo 'defbdb62a66f70c016b83ec6cfdb2f281f1e4b07709ea0a26fc0ed362f71361c  matchthis/MatchThis_MT-83.html'|sha256sum -c -
          echo '24c6e6757e5dbc85769597dda6c5df3afcb6e1e537cc9ece7664855db6ad38aa  matchthis/MatchThis_MT-83_OGLADACZ.html'|sha256sum -c -
          echo 'af5727e4f26b7019de7502963322725d6d5528f8b0ece0a91969fca1867c56ef  matchthis/MatchThis_MT-83_SEDZIA.html'|sha256sum -c -
          python3 matchthis/build-mt82-deployer.py
          python3 matchthis/build-mt83-deployer.py
          bash -n matchthis/deploy-mt83-small2.sh
          node --check matchthis/test-mt83-browser.cjs
          node matchthis/test-mt83-pzw.cjs
          echo MT83_EXACT_PRETESTED_RELEASE_AND_GUARDED_BACKUP_VERIFIED
      - name: Check actual production MT82 immutable baseline and backup public state
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://matchthis.lowcymethodowcy.smallhost.pl/ -o /tmp/mt83-before.html
          test "$(sha256sum /tmp/mt83-before.html|awk '{print $1}')" = 1e3fe8cbba31da1477b3642f514d4908bfd5d944fc3b2c7bdc1635dfebd96d26
          curl -fsSL --max-time 30 'https://matchthis.lowcymethodowcy.smallhost.pl/mt73-state.php?public=1' -o /tmp/mt83-state-before.json
          curl -fsSL --max-time 30 https://matchthis.lowcymethodowcy.smallhost.pl/mt60-draws.php -o /tmp/mt83-draws-before.json
          curl -fsSL --max-time 30 https://lowcymethodowcy.smallhost.pl/health -o /tmp/mt83-lowcy-before.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/mt83-state-before.json'))
          assert s['revision']>=9
          e=next(e for e in s['data']['events'] if e['id']=='mt2025-mega_final_2025')
          assert [sum(bool(r.get('peg') and r.get('sector')) for r in t['results']) for t in e['rounds']]==[54,54]
          assert all(any(r['competitorName']=='PEIL ANNA' for r in t['results']) for t in e['rounds'])
          c=next(e for e in s['data']['events'] if e['id']=='mt2025-champions_2025')
          assert [sum(bool(r.get('peg') and r.get('sector')) for r in t['results']) for t in c['rounds']]==[60,60]
          print('MT83_PRODUCTION_BASELINE_FINAL54_CHAMPIONS60_AND_CENTRAL_STATE_PASS',s['revision'])
          PY
      - name: Install Chromium and Firefox for LIVE SMALL2 checks
        run: |
          npm install --prefix /tmp/mt83-browser --silent playwright
          cd /tmp/mt83-browser
          npx playwright install --with-deps chromium firefox
      - name: Deploy THREE MT83 role pages to MatchThis SMALL2 ONLY, with MT82 rollback
        id: deploy
        env:
          SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: bash matchthis/deploy-mt83-small2.sh
      - name: "Real Chromium and Firefox browser clicks: homepage, no logout, sectors and responsive"
        env:
          MT83_URL: https://matchthis.lowcymethodowcy.smallhost.pl/
        run: |
          NODE_PATH=/tmp/mt83-browser/node_modules node matchthis/test-mt83-browser.cjs
          echo MT83_PRODUCTION_FIREFOX_CHROMIUM_LOGO_AND_FINAL_SECTORS_PASS
      - name: Verify production version consistency, unchanged results, draws, admin permissions and Łowcy
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://matchthis.lowcymethodowcy.smallhost.pl/ -o /tmp/mt83-after.html
          test "$(sha256sum /tmp/mt83-after.html|awk '{print $1}')" = 24c6e6757e5dbc85769597dda6c5df3afcb6e1e537cc9ece7664855db6ad38aa
          curl -fsSL --max-time 30 'https://matchthis.lowcymethodowcy.smallhost.pl/mt73-state.php?public=1' -o /tmp/mt83-state-after.json
          cmp /tmp/mt83-state-before.json /tmp/mt83-state-after.json
          curl -fsSL --max-time 30 https://matchthis.lowcymethodowcy.smallhost.pl/mt60-draws.php -o /tmp/mt83-draws-after.json
          cmp /tmp/mt83-draws-before.json /tmp/mt83-draws-after.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://matchthis.lowcymethodowcy.smallhost.pl/mt73-state.php)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://matchthis.lowcymethodowcy.smallhost.pl/panel.php)" = 303
          for r in mt83-admin.php mt83-sedzia.php;do
             code="$(curl -sS -o /dev/null -w '%{http_code}' "https://matchthis.lowcymethodowcy.smallhost.pl/role-pages/$r")"
             test "$code" = 403 || test "$code" = 404
          done
          curl -fsSL --max-time 30 https://lowcymethodowcy.smallhost.pl/health -o /tmp/mt83-lowcy-after.json
          python3 - <<'PY'
          import json
          b=json.load(open('/tmp/mt83-lowcy-before.json'))
          a=json.load(open('/tmp/mt83-lowcy-after.json'))
          assert a.get('ok')==True and a.get('version')=='S1'
          print('MT83_DEPLOY_PERSISTENCE_READONLY_LOWCY_S1_UNCHANGED')
          PY
          echo MT83_SMALL2_FINAL_PZW_ZERO_ALL_STARTERS_AND_HEADER_RELEASE_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: MatchThis_MT83_PRODUCTION_TESTED_THREE_ROLE_HTML
          path: |
            matchthis/MatchThis_MT-83.html
            matchthis/MatchThis_MT-83_OGLADACZ.html
            matchthis/MatchThis_MT-83_SEDZIA.html
          if-no-files-found: error
      - name: Restore exact MT82 if any post deployment test fails
        if: failure() && steps.deploy.outcome == 'success'
        env:
          SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: bash matchthis/deploy-mt83-small2.sh rollback
