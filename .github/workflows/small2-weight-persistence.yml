name: SMALL2 V311 real T1 T2 BF API write and cleanup test
on:
  push:
    branches: [small2-preflight-v311-20261104]
    paths:
      - '.github/workflows/small2-weight-persistence.yml'
      - 'deploy/small2-live-weight-persistence-v311.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weights:
    runs-on: ubuntu-latest
    env:
      SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone test syntax and pinned SMALL2 SSH identity
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/small2-live-weight-persistence-v311.cjs
          test -n "$SSH_PASSWORD"
          sudo apt-get -qq update
          sudo apt-get -qq install -y sshpass
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
      - name: Real authenticated round weights plus delete and persistent reload; remove TEST-only fixture
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no \
            -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes \
            -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 lowcymethodowcy@s3.small.pl \
            'cd "$HOME/lowcy-small2-20261023" && node -' < deploy/small2-live-weight-persistence-v311.cjs
