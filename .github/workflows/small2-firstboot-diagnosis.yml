name: SMALL2 V311 first-boot failure diagnosis
on:
  push:
    branches: [small2-preflight-v311-20261104]
    paths: ['.github/workflows/small2-firstboot-diagnosis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - name: Inspect sanitized first-boot error categories
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no \
            -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=15 lowcymethodowcy@s3.small.pl 'bash -s' <<'EOSSH'
          set -euo pipefail
          echo "=== FIRSTBOOT ERROR CATEGORIES ==="
          logfile="$HOME/lowcy-small2-stage-v311/first_boot_20261104.log"
          if test -r "$logfile"; then
            wc -l "$logfile"
            grep -E '^(DB_WAIT|START_FAILED|CARP_MOBILE|LOWCY_|REQ_ERR|Error:|TypeError:|ReferenceError:|SyntaxError:|[[:space:]]+code:)' "$logfile" | sed -E 's#postgres(ql)?://[^[:space:]]+#[URL_REDACTED]#g' | tail -35 || true
          else
            echo "BOOT_LOG_NOT_FOUND"
          fi
          echo "=== BOOT PERMISSIONS AND MARKER ==="
          stat -f '%Sp' "$HOME/.config/lowcy-small2/runtime.json" 2>/dev/null || true
          if test -f "$HOME/lowcy-small2-20261023/.small2-start-approved"; then echo 'START_MARKER_PRESENT'; else echo 'START_MARKER_ABSENT'; fi
          EOSSH
