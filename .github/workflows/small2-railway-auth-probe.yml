name: SMALL2 Railway workspace token GraphQL read-only validation
on:
  push:
    branches: [small2-preflight-v311-20261104]
    paths: ['.github/workflows/small2-railway-auth-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Test exact Carp Mobile App read-only GraphQL query without printing token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_API_TOKEN"
          node <<'NODE'
          const projectId='a1cb25a7-9ef3-4ee5-af9e-efafecf527ed';
          const query='query VerifyProject($id: String!) { project(id:$id) { id name } }';
          (async()=>{
            const response=await fetch('https://backboard.railway.com/graphql/v2',{
              method:'POST',
              headers:{'Content-Type':'application/json','Authorization':'Bearer '+process.env.RAILWAY_API_TOKEN},
              body:JSON.stringify({query,variables:{id:projectId}}),
              signal:AbortSignal.timeout(18000)
            });
            console.log('RAILWAY_GRAPHQL_HTTP_STATUS='+response.status);
            const body=await response.json();
            if(Array.isArray(body.errors)&&body.errors.length){
              console.log('RAILWAY_GRAPHQL_ERROR_CODES='+JSON.stringify(body.errors.map(e=>e.extensions?.code||'UNKNOWN')));
              console.log('RAILWAY_GRAPHQL_ERROR_TYPES='+JSON.stringify(body.errors.map(e=>String(e.message||'').includes('Authorized')?'AUTHORIZATION':String(e.message||'').includes('Cannot query')?'INVALID_QUERY':'OTHER')));
              process.exitCode=1; return;
            }
            const project=body?.data?.project;
            if(project?.id===projectId&&project?.name==='Carp Mobile App'){
              console.log('RAILWAY_SCOPED_TOKEN_PROJECT_QUERY_OK project=Carp Mobile App');
            }else{
              console.log('RAILWAY_SCOPED_TOKEN_PROJECT_QUERY_UNEXPECTED');
              process.exitCode=1;
            }
          })().catch(e=>{console.log('RAILWAY_GRAPHQL_CONNECTION_ERROR '+(e.name||'UnknownError'));process.exitCode=1;});
          NODE
