        for kind in ('deploy','rollback'):
         script=(D/f'{kind}-mt66-small2.sh').read_text('utf8')
         for old,new in (
          ('MT-66','MT-67'),('MT66','MT67'),('mt66','mt67'),('mt-66','mt-67'),
          ('MT-65','MT-66'),('MT65','MT66'),('mt65','mt66'),('mt-65','mt66')
         ):script=script.replace(old,new)
         assert 'index-MT66.backup' in script
         assert 'matchthis-independent/mt-67' in script
         assert 'MatchThis_MT-67_OGLADACZ.html' in script
         assert ('MT67_VERSION_AUTH_HTTPS_OK' in script if kind=='deploy' else 'MT67_ROLLBACK_MT66' in script)
         (D/f'{kind}-mt67-small2.sh').write_text(script,'utf8')
        print('MT67_MT66_BACKUP_ROLLBACK_READY')
        PY
        bash -n matchthis/deploy-mt67-small2.sh
        bash -n matchthis/rollback-mt67-small2.sh
    - name: Deploy only MatchThis MT67 HTML on SMALL2 preserving PHP API, published draws and all data
      id: deploy
      run: bash matchthis/deploy-mt67-small2.sh
    - name: Install Playwright Chromium and Firefox for live UI and ZIP inspections
      run: |
        mkdir -p /tmp/mt67-live && cd /tmp/mt67-live
        npm init -y >/dev/null
        npm install --silent playwright
        npx playwright install --with-deps chromium firefox
    - name: Real anonymous site and isolated admin clicks, 6/5-sector draw-only ZIP, PNG dimensions, FOTO FB, no regression
      run: |
        set -euo pipefail
        cd /tmp/mt67-live
        node --input-type=module <<'JS'
        import {chromium,firefox} from 'playwright';
        import fs from 'node:fs';
        const url='https://matchthis.lowcymethodowcy.smallhost.pl/';
        const eventId='mt2026-xiv-puchar-matchthis-28-29-nov';
        const content=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/matchthis/MatchThis_MT-67.html','utf8');
        function checkZip(buf,expected,engine,mode){
         let pos=0,names=[],first=null;
         while(pos+30<=buf.length&&buf.readUInt32LE(pos)===0x04034b50){
          const method=buf.readUInt16LE(pos+8),size=buf.readUInt32LE(pos+18);
          const nameSize=buf.readUInt16LE(pos+26),extra=buf.readUInt16LE(pos+28);
          const name=buf.toString('utf8',pos+30,pos+30+nameSize);
          const start=pos+30+nameSize+extra;
          if(method!==0||!name.endsWith('_LOSOWANIE_FB.png'))throw Error('ZIP_FILE_FORMAT '+name);
          const image=buf.subarray(start,start+size);
          if(image.subarray(0,8).toString('hex')!=='89504e470d0a1a0a'||image.readUInt32BE(16)!==2160||image.readUInt32BE(20)!==2700)
           throw Error('PNG_DIMENSIONS '+name);
          names.push(name);if(!first)first=image;
          pos=start+size;
         }
         if(names.length!==expected||new Set(names).size!==expected)throw Error('SECTOR_ZIP_COUNT '+JSON.stringify(names));
         for(let i=0;i<expected;i++)if(!names.includes('SEKTOR_'+String.fromCharCode(65+i)+'_LOSOWANIE_FB.png'))
          throw Error('ZIP_MISSING_SECTOR_'+i);
         console.log('MT67_ZIP_PNG_INSPECTION_PASS',engine,mode,expected,'PNG_2160x2700');
         return first;
        }
        for(const [name,type] of [['Chromium',chromium],['Firefox',firefox]]){
         const browser=await type.launch({headless:true});
         try{
          const ctx=await browser.newContext({viewport:{width:1366,height:900},acceptDownloads:true});
          const errors=[];let p=await ctx.newPage();p.on('pageerror',e=>errors.push(e.message));
          const response=await p.goto(url,{waitUntil:'networkidle',timeout:55000});
          if(response.status()!==200||await p.title()!=='MatchThis MT-67'||await p.locator('#appversion').innerText()!=='MT-67')
           throw Error(name+' LIVE_VERSION');
          const real=await p.evaluate(async()=>{
           await mt60RefreshPublicDraws();
           const r=await fetch('/mt60-draws.php',{cache:'no-store',credentials:'omit'});
           const result=await r.json();return {http:r.status,draws:result.draws};
          });
          if(real.http!==200||!Array.isArray(real.draws))throw Error(name+' ANONYMOUS_PUBLIC_API');
          const inEvent=real.draws.filter(x=>x.eventId===eventId);
          const expectedRows=inEvent.reduce((n,x)=>n+x.rows.length,0);
          const expectedCards=inEvent.reduce((n,x)=>n+new Set(x.rows.map(y=>y.sector)).size,0);
          await p.locator('[data-view="events"]').first().click();
          await p.locator('[data-open="'+eventId+'"]').first().click();
          await p.locator('[data-result-mode="publishedDraw"]').click();
          const pubCards=await p.locator('.mt60-draw-card').count();
          const pubRows=await p.locator('.mt60-draw-card tbody tr').count();
          console.log('MT67_ACTUAL_PUBLIC_DRAW_STATE',name,JSON.stringify({publishedRounds:inEvent.length,rows:expectedRows,cards:expectedCards,visibleRows:pubRows,visibleCards:pubCards}));
          if(pubCards!==expectedCards||pubRows!==expectedRows)
           throw Error(name+' PUBLIC_DRAW_REGRESSION '+JSON.stringify({expectedRows,expectedCards,pubRows,pubCards}));
          if(await p.locator('[data-action="mt67DownloadAllDrawSectors"]').count()!==0)throw Error(name+' VIEWER_DOWNLOAD_ACCESS');
          await ctx.close();
          // All data mutations below happen in a fresh, isolated JS test page; never on the production server.
          const isolated=await browser.newContext({viewport:{width:1450,height:920},acceptDownloads:true});
          await isolated.addInitScript(()=>{
           const store={};
           Object.defineProperty(window,'localStorage',{configurable:true,value:{
            getItem:k=>Object.hasOwn(store,k)?store[k]:null,setItem:(k,v)=>{store[k]=String(v)},removeItem:k=>delete store[k],
            clear:()=>{for(const k of Object.keys(store))delete store[k]},get length(){return Object.keys(store).length},
            key:i=>Object.keys(store)[i]||null
           }});
          });
          p=await isolated.newPage();p.on('pageerror',e=>errors.push(e.message));
          await p.route('**/mt67-test-isolated.html',route=>route.fulfill({status:200,contentType:'text/html',body:content}));
          await p.goto(url+'mt67-test-isolated.html',{waitUntil:'load',timeout:60000});
          if(await p.title()!=='MatchThis MT-67')throw Error(name+' ADMIN_TEST_VERSION');
          const init=await p.evaluate(()=>{
           const e=db.events.find(mt52IsXiv);
           const players=e.entrantIds.map(findPlayer).filter(x=>x&&!x.isReservation);
           if(players.length!==71)throw Error('TEST_EXPECTS_71');
           const t=e.rounds[0];e.mt63ConfirmedIds=players.map(x=>x.id);
           const sizes=[11,12,12,12,12,12],pegs=Array.from({length:71},(_,i)=>i+1);
           let index=0;const plan=sizes.map((size,i)=>({sector:String.fromCharCode(65+i),pegs:pegs.slice(index,index+=size)}));
           const sectors=new Map(plan.flatMap(g=>g.pegs.map(peg=>[peg,g.sector])));
           t.mt55SectorPlan={pegs,sectors:6,sizes};
           t.mt55Entries=players.map((player,i)=>({competitorId:player.id,competitorName:fullName(player),peg:i+1,sector:sectors.get(i+1),weightG:null}));
           page='event';selectedId=e.id;roundIndex=0;resultMode='draw';render();
           return {confirmed:mt63Confirmed(e).length,range:document.querySelector('#pegs')?.value,buttons:document.querySelectorAll('[data-action="mt67DownloadAllDrawSectors"]').length};
          });
          if(init.confirmed!==71||init.range!=='1-71'||init.buttons!==1)throw Error(name+' CONFIRMED_ROSTER_DRAW_'+JSON.stringify(init));
          let dl;
          const a=p.waitForEvent('download',{timeout:60000});
          await p.locator('[data-action="mt67DownloadAllDrawSectors"]').click();dl=await a;
          const path6='/tmp/mt67-live/'+name+'-6.zip';await dl.saveAs(path6);
          const first=checkZip(fs.readFileSync(path6),6,name,'LOSOWANIE');
          fs.writeFileSync('/tmp/mt67-live/'+name+'-SEKTOR_A.png',first);
          await p.locator('[data-view="photoHub"]').click();
          if(await p.locator('#mt67DrawEvent').count()!==1||await p.locator('#mt67DrawRound').count()!==1)throw Error(name+' PHOTO_HUB_EXPORT_MISSING');
          await p.locator('#mt67DrawEvent').selectOption(eventId);
          await p.locator('#mt67DrawRound').selectOption('0');
          if(await p.locator('[data-action="downloadFbPhoto"]').count()!==1)throw Error(name+' RESULTS_PHOTO_REMOVED');
          const b=p.waitForEvent('download',{timeout:60000});
          await p.locator('[data-action="mt67DownloadAllDrawSectors"]').click();dl=await b;
          const pathHub='/tmp/mt67-live/'+name+'-hub.zip';await dl.saveAs(pathHub);
          checkZip(fs.readFileSync(pathHub),6,name,'FOTO_FB_HUB');
          // Verify non-6 sector counts produce exactly one image per sector.
          await p.evaluate(()=>{
           const e=db.events.find(mt52IsXiv),t=e.rounds[0];
           const sizes=[14,14,14,14,15],pegs=Array.from({length:71},(_,i)=>i+1);
           let offset=0,plan=sizes.map((size,i)=>({sector:String.fromCharCode(65+i),pegs:pegs.slice(offset,offset+=size)}));
           const sectors=new Map(plan.flatMap(g=>g.pegs.map(peg=>[peg,g.sector])));
           t.mt55SectorPlan={pegs,sectors:5,sizes};
           t.mt55Entries=t.mt55Entries.map(x=>({...x,sector:sectors.get(x.peg)}));
           resultMode='draw';page='event';selectedId=e.id;roundIndex=0;render();
          });
          const c=p.waitForEvent('download',{timeout:60000});
          await p.locator('[data-action="mt67DownloadAllDrawSectors"]').click();dl=await c;
          const path5='/tmp/mt67-live/'+name+'-5.zip';await dl.saveAs(path5);
          checkZip(fs.readFileSync(path5),5,name,'FIVE_SECTORS');
          const intact=await p.evaluate(()=>{
           const e=db.events.find(mt52IsXiv),t=e.rounds[0];return {entries:t.mt55Entries.length,confirmed:mt63Confirmed(e).length,assigned:t.mt55Entries.filter(x=>x.peg!=null).length,weights:t.mt55Entries.filter(x=>x.weightG!=null).length,reserve:e.entrantIds.length-mt63Players(e).length};
          });
          if(intact.entries!==71||intact.confirmed!==71||intact.assigned!==71||intact.weights!==0||intact.reserve!==1)
           throw Error(name+' DATA_MUTATED_BY_EXPORT_'+JSON.stringify(intact));
          if(errors.length)throw Error(name+' PAGE_ERRORS_'+JSON.stringify(errors));
          console.log('MT67_LIVE_DRAW_ONLY_6_SECTORS_5_SECTORS_PHOTO_HUB_AUTH_AND_PRESERVATION_PASS',name,JSON.stringify(intact));
          await isolated.close();
         }finally{await browser.close();}
        }
        JS
    - name: Package all verified HTML roles and actual rendered sector samples
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MatchThis_MT-67_verified
        path: |
          matchthis/MatchThis_MT-67.html
          matchthis/MatchThis_MT-67_OGLADACZ.html
          matchthis/MatchThis_MT-67_SEDZIA.html
          /tmp/mt67-live/*-SEKTOR_A.png
        if-no-files-found: error
    - name: Roll back ONLY MatchThis to MT66 if deployed browser tests fail
      if: failure() && steps.deploy.outcome == 'success'
      run: bash matchthis/rollback-mt67-small2.sh
