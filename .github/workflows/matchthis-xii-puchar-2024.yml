name: Import XII Puchar MatchThis.pl 2024 on SMALL2
on:
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: [.github/workflows/matchthis-xii-puchar-2024.yml, matchthis/import-xii-puchar-2024.py]
permissions: {contents: read, actions: read}
concurrency:
  group: matchthis-small2-xii-2024-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and live roster without writes
        run: |
          set -euo pipefail
          python3 -m py_compile matchthis/import-xii-puchar-2024.py
          curl --retry 3 --fail --silent --show-error 'https://matchthis.lowcymethodowcy.smallhost.pl/mt73-state.php?public=1' -o /tmp/xii-before.json
          python3 - <<'PY'
          import json,runpy
          data=json.load(open('/tmp/xii-before.json'))['data']
          event,new=runpy.run_path('matchthis/import-xii-puchar-2024.py')['build'](data)
          assert not any(e.get('id')==event['id'] for e in data['events']), 'Event already published; do not overwrite'
          assert len(event['rounds'])==2 and all(len(r['results'])==61 for r in event['rounds'])
          assert not any(p['id'] in {x['id'] for x in data['players']} for p in new)
          print('SOURCE PREFLIGHT PASSED: 122 starty / 62 zawodnikow / nowe profile',len(new))
          PY
      - name: Prepare both Playwright browser checks before changing live data
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Import just XII Puchar with pinned SSH, protected backup and atomic write
        env:
          SSHPASS: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > ~/.ssh/known_hosts 2>/dev/null
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')" = SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password lowcymethodowcy@s3.small.pl 'python3 - "$HOME/domains/matchthis.lowcymethodowcy.smallhost.pl/public_html/.mt41-private"' < matchthis/import-xii-puchar-2024.py
      - name: Compare production state before/after and source 122 rows
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 --fail --silent --show-error 'https://matchthis.lowcymethodowcy.smallhost.pl/mt73-state.php?public=1' -o /tmp/xii-after.json
          python3 - <<'PY'
          import json,runpy
          before=json.load(open('/tmp/xii-before.json'))['data']
          after=json.load(open('/tmp/xii-after.json'))['data']
          wanted,new=runpy.run_path('matchthis/import-xii-puchar-2024.py')['build'](after)
          assert not new,'All competitors must now have saved profiles'
          events=[e for e in after['events'] if e['id']==wanted['id']]
          assert len(events)==1 and events[0]==wanted
          assert len(after['events'])==len(before['events'])+1
          assert len(set(e['id'] for e in after['events']))==len(after['events'])
          for old in before['events']:
              assert old in after['events'],('Historic event changed',old['id'])
          for old in before['players']:
              assert old in after['players'],('Historic player changed',old['id'])
          assert len(after['players'])>=len(before['players'])
          assert len(set(p['id'] for p in after['players']))==len(after['players'])
          for t in events[0]['rounds']:
              assert len(t['results'])==61
          print('LIVE JSON VERIFIED: 122 rows; original events/players unchanged; source bit-for-bit match')
          PY
      - name: Test published HTML through actual archive/tour clicks and all 62 histories
        run: |
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          url='https://matchthis.lowcymethodowcy.smallhost.pl/'
          event=next(e for e in json.load(open('/tmp/xii-after.json'))['data']['events'] if e['id']=='mt2024-xii-puchar-matchthis')
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              page=browser.new_page(viewport={'width':1366,'height':900})
              errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              def expose_history(route):
                  response=route.fetch()
                  html=response.text()
                  marker='function playerHistory(personId){'
                  assert html.count(marker)==1
                  route.fulfill(response=response,body=html.replace(marker,'window.readHistoryForTest=playerHistory;'+marker))
              page.route(url,expose_history)
              page.goto(url,wait_until='domcontentloaded')
              page.wait_for_function("document.querySelector('#mt73-sync')?.textContent.includes('Dane z serwera')",timeout=45000)
              assert 'MT-95' in page.title(),page.title()
              page.locator('[data-view="archive"]').first.click()
              fold=page.locator('details[data-year="2024"]')
              if fold.get_attribute('open') is None: fold.locator('summary').click()
              fold.locator('[data-open="mt2024-xii-puchar-matchthis"]').first.click()
              for index in (0,1):
                  page.locator(f'[data-round="{index}"]').first.click()
                  page.locator('[data-result-mode="sectors"]').first.click()
                  titles=page.locator('.sector-title')
                  assert titles.count()==7,(index,titles.count())
                  expected=({'A':9,'B':9,'C':9,'D':9,'E':9,'F':8,'G':8} if index==0 else {'A':9,'B':9,'C':9,'D':9,'E':8,'F':9,'G':8})
                  for pos,sector in enumerate('ABCDEFG'):
                      title=titles.nth(pos)
                      assert 'SEKTOR '+sector in title.inner_text().upper()
                      rows=title.locator('xpath=following-sibling::*[1]').locator('tbody tr')
                      assert rows.count()==expected[sector],(index,sector,rows.count())
              all_expected={}
              for round_index,t in enumerate(event['rounds']):
                  for r in t['results']:
                      all_expected.setdefault(r['competitorId'],[]).append((t['id'],r['sector'],r['peg'],r['weightG'],r['officialPlace']))
              assert len(all_expected)==62,len(all_expected)
              for pid,expected in all_expected.items():
                  hist=page.evaluate("(id)=>window.readHistoryForTest(id).find(e=>e.id==='mt2024-xii-puchar-matchthis')",pid)
                  assert hist is not None,('No history',pid)
                  actual=[(r['tourId'],r['sector'],r['peg'],r['weightG'],r['place']) for r in hist['rows']]
                  assert sorted(actual)==sorted(expected),('History mismatch',pid,actual,expected)
              kot_marcin=event['rounds'][0]['results']
              kot_bogumil=event['rounds'][1]['results']
              a=next(r for r in kot_marcin if 'KOT MARCIN'==r['competitorName'].upper())
              b=next(r for r in kot_bogumil if 'KOT BOGUMIŁ'==r['competitorName'].upper())
              assert a['competitorId']!=b['competitorId']
              assert len(all_expected[a['competitorId']])==1 and len(all_expected[b['competitorId']])==1
              assert not errors,errors
              print('LIVE HTML VERIFIED: actual 2 tour clicks, 14 sector tables, 122 rows, 62 histories, Kot separate, zero JS errors')
              browser.close()
          PY
