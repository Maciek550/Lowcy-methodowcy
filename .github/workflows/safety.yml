name: Bezpieczne losowanie i kontrola wersji
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lowcy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lowcy_ci
      TEST_PORT: '32917'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalacja zależności do testów integracyjnych
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Testy regresji i PostgreSQL
        run: npm test
      - name: Sprawdzenie składni
        run: |
          node --check server.cjs
          node --check app.js
          node --check safety-core.cjs
