name: MatchThis SMALL2 isolated READ ONLY inventory
on:
  push:
    branches: [matchthis-isolated-staging-20261106]
    paths: ['.github/workflows/matchthis-small2-readonly.yml']
permissions: { contents: read }
jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - name: Validate SSH host and perform strictly read-only inspection
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD" || { echo 'MISSING_GITHUB_SECRET'; exit 2; }
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 lowcymethodowcy@s3.small.pl 'bash -s' <<'EOSSH'
          set -euo pipefail
          echo '=== MATCHTHIS_INVENTORY_ACCOUNT ==='
          id -un
          echo '=== MATCHTHIS_INVENTORY_WWW ==='
          devil www list
          echo '=== MATCHTHIS_INVENTORY_PGSQL ==='
          devil pgsql list
          echo '=== MATCHTHIS_INVENTORY_WWW_HELP ==='
          devil www help 2>&1 | head -85 || true
          echo '=== MATCHTHIS_INVENTORY_PGSQL_HELP ==='
          devil pgsql help 2>&1 | head -95 || true
          echo '=== MATCHTHIS_INVENTORY_TOP_LEVEL_NAMES ==='
          find "$HOME" -maxdepth 1 -mindepth 1 -printf '%f %y\n' | sort | grep -Ei 'match|lowcy|domain|node|www' || true
          echo '=== MATCHTHIS_INVENTORY_DONE_NO_CHANGES ==='
          EOSSH
