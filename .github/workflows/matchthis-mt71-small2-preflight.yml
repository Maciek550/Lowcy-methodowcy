name: MatchThis MT71 SMALL2 pre-deploy current production identity check
'on':
  push:
    branches:
      - matchthis-mt23-independent-small2-20261106
    paths:
      - .github/workflows/matchthis-mt71-small2-preflight.yml
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-24.04
    env:
      SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - name: Verify host key and read-only MatchThis production snapshots
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get -qq update
          sudo apt-get -qq install -y sshpass
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          sshpass -e ssh "${opts[@]}" lowcymethodowcy@s3.small.pl 'bash -s' <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/matchthis.lowcymethodowcy.smallhost.pl/public_html"
          test -f "$base/index.html" && test -f "$base/panel.php"
          test ! -L "$base/index.html" && test ! -L "$base/panel.php"
          php -l "$base/panel.php" >/dev/null
          for f in "$base/role-pages/mt70-admin.php" "$base/role-pages/mt70-sedzia.php";do
            test -f "$f" && test ! -L "$f"
            test "$(head -n1 "$f")" = '<?php if (!defined("MATCHTHIS_AUTHED")) {http_response_code(404);exit;} ?>'
          done
          view="$(sha256sum "$base/index.html" | awk '{print $1}')"
          admin="$(tail -n +2 "$base/role-pages/mt70-admin.php" | sha256sum | awk '{print $1}')"
          judge="$(tail -n +2 "$base/role-pages/mt70-sedzia.php" | sha256sum | awk '{print $1}')"
          echo "SMALL2_PRODUCTION_VIEW_SHA=$view"
          echo "SMALL2_PRODUCTION_ADMIN_SHA=$admin"
          echo "SMALL2_PRODUCTION_JUDGE_SHA=$judge"
          test "$view" = ef6f8b5839f56f44fba6fff47eaf26d09714d7861ef7285199167dde94db9ee0
          test "$admin" = e21ba17b772dd52152fdad791bc1ad2cdd80d614084c55ec36b763f1f9cfa07e
          test "$judge" = e0c3dcab7211a8f0fbab4ac0d17599df65bfe92520025b8b06c5e5f24b3ab72b
          grep -Fq 'mt70-admin.php' "$base/panel.php"
          grep -Fq 'mt70-sedzia.php' "$base/panel.php"
          test -f "$base/mt60-draws.php"
          echo SMALL2_MT70_THREE_ROLE_PRODUCTION_AND_ROUTER_SHA_PREFLIGHT_PASS
          REMOTE
