      - name: Package all verified MT60 HTML roles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MatchThis_MT-60_HTML
          path: |
            matchthis/MatchThis_MT-60.html
            matchthis/MatchThis_MT-60_SEDZIA.html
            matchthis/MatchThis_MT-60_OGLADACZ.html
          if-no-files-found: error
      - name: Rollback MatchThis to MT59 if live checks fail
        if: failure() && steps.deploy.outcome != 'skipped'
        run: bash matchthis/rollback-mt60-small2.sh
