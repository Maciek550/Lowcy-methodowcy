name: "V298 One or two round competitions"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v298-release.yml'

permissions:
  contents: write

jobs:
  patch-test-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lowcy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lowcy_ci
      TEST_PORT: '32917'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Apply V298 source changes"
        run: python tools/v298_patch3.py

      - name: "Install dependencies"
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: "Syntax check"
        run: |
          node --check server.cjs
          node --check app.js
          git diff --check

      - name: "Run focused V298 tests and full existing regression suite"
        run: npm test

      - name: "Validate release invariants"
        run: |
          grep -q "const APP_VERSION = '298';" server.cjs
          grep -q "V298_ONE_TWO_ROUNDS" server.cjs
          grep -q "V298_ONE_TWO_ROUNDS" app.js
          grep -q "round_count integer not null default 2" server.cjs
          grep -q "Zawody 1-turowe" server.cjs
          grep -q "Zawody 2-turowe" server.cjs

      - name: "Commit V298 only after all tests pass"
        run: |
          git config user.name "lowcy-v298-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.cjs app.js tests/*.test.cjs
          git commit -m "V298: one-round competitions with two-round regression protection"
          git push
