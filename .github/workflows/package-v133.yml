name: Package V133
on:
  push:
    branches:
      - v133-history-sector-place
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V133
        uses: actions/checkout@v4
      - name: Build deployment ZIP
        run: zip -r Lowcy-methodowcy-V133.zip . -x ".git/*" ".github/*" "app-V133.js"
      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lowcy-methodowcy-V133
          path: Lowcy-methodowcy-V133.zip
          retention-days: 1
