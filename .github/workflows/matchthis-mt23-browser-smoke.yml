name: MatchThis MT23 LIVE browser smoke
on:
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: ['.github/workflows/matchthis-mt23-browser-smoke.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  chromium-live:
    runs-on: ubuntu-latest
    steps:
      - name: Install real Chromium test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matchthis-smoke
          cd /tmp/matchthis-smoke
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium
      - name: Click through LIVE https MatchThis in desktop and mobile Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/matchthis-smoke
          node --input-type=module <<'JAVASCRIPT'
          import { chromium } from 'playwright';
          import { readFile } from 'node:fs/promises';
          const browser=await chromium.launch({headless:true});
          try {
            for(const width of [390,1366]){
              const context=await browser.newContext({viewport:{width,height:900},acceptDownloads:true});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push('PAGE:'+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE:'+m.text())});
              const response=await page.goto('https://matchthis.lowcymethodowcy.smallhost.pl/',{waitUntil:'domcontentloaded',timeout:45000});
              if(response.status()!==200)throw Error('LIVE_RESPONSE_'+response.status());
              await page.locator('#appversion').waitFor();
              if(!(await page.title()).includes('MT-23'))throw Error('VERSION_TITLE_MISMATCH');
              if(!(await page.locator('#appversion').innerText()).includes('MT-23'))throw Error('VERSION_BAR_MISMATCH');
              if(!(await page.locator('details.year-fold[data-year="2026"]').count()))throw Error('ARCHIVE_2026_MISSING');
              const stored=await page.evaluate(()=>localStorage.getItem('matchthis-preview-MT-23'));
              if(!stored || !JSON.parse(stored).cycles?.length)throw Error('ARCHIVE_LOCAL_DATA_MISSING');
              await page.locator('#nav [data-view="cycles"]').click();
              if(!(await page.locator('#main').innerText()).includes('MEGA MATCH THIS CUP 2026'))throw Error('CYCLES_NAVIGATION_FAILED');
              await page.locator('#nav [data-view="events"]').click();
              if(!(await page.locator('#main').innerText()).includes('TRAPER CUP'))throw Error('EVENTS_NAVIGATION_FAILED');
              await page.locator('#nav [data-view="photoHub"]').click();
              await page.locator('#fbCanvas').waitFor();
              const photoPromise=page.waitForEvent('download',{timeout:30000});
              await page.locator('[data-action="downloadFbPhoto"]').click();
              const photo=await photoPromise;
              const photoBytes=await readFile(await photo.path());
              if(photoBytes[0]!==255 || photoBytes[1]!==216 || photoBytes.length<10000)throw Error('LIVE_FB_JPG_INVALID');
              const pdfPromise=page.waitForEvent('download',{timeout:30000});
              await page.locator('[data-action="downloadHubPdf"]').click();
              const pdf=await pdfPromise;
              const pdfBytes=await readFile(await pdf.path());
              if(pdfBytes.toString('ascii',0,5)!=='%PDF-')throw Error('LIVE_PDF_INVALID');
              if(pdfBytes.includes(Buffer.from('/Subtype /Image')))throw Error('LIVE_PDF_RASTER_FOUND');
              await page.locator('#roleMode').selectOption('viewer');
              if(!(await page.locator('#nav [data-view="photoHub"]').count()))throw Error('VIEWER_PHOTO_NAV_MISSING');
              if(await page.locator('[data-view="newEvent"]').isVisible().catch(()=>false))throw Error('VIEWER_ADMIN_BUTTON_VISIBLE');
              await page.screenshot({path:'/tmp/MT23_LIVE_'+width+'.png',fullPage:false});
              await page.reload({waitUntil:'domcontentloaded'});
              const restored=await page.evaluate(()=>localStorage.getItem('matchthis-preview-MT-23'));
              if(restored!==stored)throw Error('LOCAL_PERSISTENCE_MISMATCH');
              const dimensions=await page.evaluate(()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth}));
              if(dimensions.scrollWidth>dimensions.clientWidth+2)throw Error('HORIZONTAL_OVERFLOW_'+width+'_'+JSON.stringify(dimensions));
              if(errors.length)throw Error('LIVE_BROWSER_ERRORS:'+errors.join('; ').slice(0,600));
              console.log('LIVE_MT23_OK viewport='+width+' JPG='+photoBytes.length+' PDF='+pdfBytes.length+' localStorageReloadOK=true');
              await context.close();
            }
          } finally {await browser.close()}
          JAVASCRIPT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matchthis-mt23-live-browser
          path: /tmp/MT23_LIVE_*.png
          if-no-files-found: ignore
          retention-days: 7
