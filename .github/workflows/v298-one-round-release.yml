name: "V298 one/two round tested release"

on:
  push:
    branches: ['feature/v298-one-round']
    paths:
      - '.github/workflows/v298-one-round-release.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lowcy_v298
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lowcy_v298
      TEST_PORT: '32917'
      V298_TEST_PORT: '32928'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Apply V298 source changes
        run: python tools/v298_patch.py

      - name: Static validation
        shell: bash
        run: |
          node --check server.cjs
          node --check app.js
          node --check draw-notice.cjs
          grep -q "const APP_VERSION = '298';" server.cjs
          grep -q "V298_ONE_TWO_ROUND_COMPETITIONS" app.js
          grep -q "round_count integer not null default 2" server.cjs
          grep -q 'name="cRoundCount"' server.cjs
          grep -q "players-dark-v298.css" server.cjs
          test -f players-dark-v298.css
          git diff --check

      - name: Existing regression suite
        run: npm test

      - name: Focused V298 one/two round integration
        run: node tests/v298-round-mode.cjs

      - name: Commit and release V298 to main only after tests pass
        shell: bash
        run: |
          git config user.name "lowcy-v298-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.cjs app.js draw-notice.cjs players-dark-v298.css tests/v298-round-mode.cjs tools/v298_patch.py .github/workflows/v298-one-round-release.yml
          git commit -m "V298: add tested one/two round competition modes"
          git push origin HEAD:main
