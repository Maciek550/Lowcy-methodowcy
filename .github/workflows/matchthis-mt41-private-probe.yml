name: MatchThis MT41 private auth PHP readability probe with automatic cleanup
on:
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: ['.github/workflows/matchthis-mt41-private-probe.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - name: Read-only auth path inspection through temporary probe restricted to MatchThis vhost
        run: |
          set -euo pipefail
          test -n "$SSH_PASSWORD"
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 lowcymethodowcy@s3.small.pl 'bash -s' <<'REMOTE'
          set -euo pipefail
          web="$HOME/domains/matchthis.lowcymethodowcy.smallhost.pl/public_html"
          test -f "$HOME/matchthis-independent/MT40-OWNED"
          test ! -e "$web/mt41-private-readonly-probe.php"
          cat > "$web/mt41-private-readonly-probe.php" <<'PHP'
          <?php
          header('Cache-Control: no-store');
          header('Content-Type: text/plain; charset=UTF-8');
          $root=dirname(__DIR__,3);
          $homeAuth=$root.'/matchthis-independent/auth/mt41-auth.php';
          $domainPrivate=dirname(__DIR__).'/.matchthis-private-auth';
          echo 'PHP_VERSION='.PHP_VERSION.' OPEN_BASEDIR='.ini_get('open_basedir')
            .' DOMAIN_PARENT_VISIBLE='.(is_dir(dirname(__DIR__))?1:0)
            .' HOME_PRIVATE_ACCESSIBLE='.(is_readable($homeAuth)?1:0)
            .' DOMAIN_PARENT_WRITABLE='.(is_writable(dirname(__DIR__))?1:0)
            .' DOMAIN_PRIVATE_EXISTS='.(is_dir($domainPrivate)?1:0);
          PHP
          trap 'rm -f "$web/mt41-private-readonly-probe.php"' EXIT
          chmod 644 "$web/mt41-private-readonly-probe.php"
          curl -fsSL --max-time 20 'https://matchthis.lowcymethodowcy.smallhost.pl/mt41-private-readonly-probe.php'
          echo
          REMOTE
