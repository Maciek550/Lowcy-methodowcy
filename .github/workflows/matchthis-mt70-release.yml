    - name: Build MT65 from SHA-verified MT64 keeping confirmed roster and historical results
      run: |
        set -euo pipefail
        test -f AGENTS.md
        python3 matchthis/build-mt65.py
        python3 - <<'PY'
        from pathlib import Path
        import hashlib
        D=Path('matchthis')
        expected={
          '':'4bddcfc8a7b8360fc7f42e7e83477c93063bdbb5a122fe67c487a414fb3579d3',
          '_OGLADACZ':'70270279df0aa4da7079996912f2d7d38d049adaf5282a10323c9aa398459423',
          '_SEDZIA':'03a82edd96d755343388f579d4d48d9e9b5805871454829b6f5bda779ffc4c2f'
        }
        for role,sha in expected.items():
          f=D/f'MatchThis_MT-65{role}.html';txt=f.read_text('utf8')
          assert hashlib.sha256(f.read_bytes()).hexdigest()==sha,('MT65 exact verified source mismatch',role)
          for marker in ('<title>MatchThis MT-65</title>','data-version="MT-65"', 'aria-label="Wersja MT-65">MT-65',"const APP_VERSION='MT-65'"):
            assert marker in txt,(role,marker)
          for keep in ('function mt63Confirmed(e)', 'function mt64RosterNameNeedsReview', 'function mt65SaveSectorSize', 'function mt65DrawRosterImage'):
            assert keep in txt,(role,keep)
          print('MT65_ROLE_SHA_VERSION_BASELINE_PASS',role)
        for kind in ('deploy','rollback'):
          script=(D/f'{kind}-mt64-small2.sh').read_text('utf8')
          for old,new in (
           ('MT-64','MT-65'),('MT64','MT65'),('mt64','mt65'),('mt-64','mt-65'),
           ('MT-63','MT-64'),('MT63','MT64'),('mt63','mt64'),('mt-63','mt-64')
