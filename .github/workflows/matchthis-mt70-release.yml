    - name: Build exact MT68 from MT67 and validate all three roles with rollback to MT67
      run: |
        set -euo pipefail
        test -f AGENTS.md
        python3 matchthis/build-mt68.py
        python3 - <<'PY'
        from pathlib import Path
        import hashlib,re
        D=Path('matchthis')
        versions={
         '':'00a8723e9ef9efaf47c6a19d27b30c4315d4c6012a5bc90bc1e9ed9247146f7c',
         '_OGLADACZ':'5d85a7215413e010078f83faea3650f16c99bb4178f11ea49dec7b2b17a823d3',
         '_SEDZIA':'c513e98b696837e847b22584bbb4d5c237196f2bc85ebb4fdcb60320e3940a08'
        }
        for role,sha in versions.items():
          file=D/f'MatchThis_MT-68{role}.html'
          s=file.read_text('utf8')
          assert hashlib.sha256(file.read_bytes()).hexdigest()==sha,('MT68 exact source mismatch',role)
          for marker in ('<title>MatchThis MT-68</title>', 'data-version="MT-68"',
             'aria-label="Wersja MT-68">MT-68',"const APP_VERSION='MT-68';",
             "const STORAGE_KEY='matchthis-preview-MT-68';",'function mt68TourLabel(', 'function mt68TourDayDate('):
            assert marker in s,(role,marker)
          assert 'function mt67DownloadAllDrawSectors' in s or 'mt67DownloadAllDrawSectors' in s
          assert 'function mt66BulkConfirm' in s
          assert 'function datedTourLabel(tour,entity){return mt68TourLabel(tour,entity);}' in s
          print('MT68_VERSION_DATA_FUNCTIONS_JS_CHECK_PASS',role)
        for kind in ('deploy','rollback'):
          source=(D/f'{kind}-mt67-small2.sh').read_text('utf8')
          for old,new in (
           ('MT-67','MT-68'),('MT67','MT68'),('mt67','mt68'),('mt-67','mt-68'),
           ('MT-66','MT-67'),('MT66','MT67'),('mt66','mt67'),('mt-66','mt-67')
          ):source=source.replace(old,new)
          assert 'index-MT67.backup' in source,kind
          assert 'matchthis-independent/mt-68' in source,kind
          assert 'MatchThis_MT-68_OGLADACZ.html' in source,kind
          assert ('MT68_VERSION_AUTH_HTTPS_OK' in source if kind=='deploy' else 'MT68_ROLLBACK_MT67' in source),kind
          (D/f'{kind}-mt68-small2.sh').write_text(source,'utf8')
        print('MT68_MT67_BACKUP_ROLLBACK_READY')
        PY
        bash -n matchthis/deploy-mt68-small2.sh
        bash -n matchthis/rollback-mt68-small2.sh
