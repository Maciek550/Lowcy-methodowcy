    - name: Deploy only MatchThis MT70 HTML to SMALL2 preserving API, db, and all prior results
      id: deploy
      run: bash matchthis/deploy-mt70-small2.sh
    - name: Install Chromium and Firefox
      run: |
        mkdir -p /tmp/mt70-live && cd /tmp/mt70-live
        npm init -y >/dev/null
        npm install --silent playwright
        npx playwright install --with-deps chromium firefox
    - name: Test live public viewer A11, independent old-storage migration and safeguards in both browsers
      run: |
        set -euo pipefail
        cd /tmp/mt70-live
        node --input-type=module <<'JS'
        import {chromium,firefox} from 'playwright';
        import fs from 'node:fs';
        const base='https://matchthis.lowcymethodowcy.smallhost.pl/';
        const eventId='mt2026-traper-cup-kobialka';
        const oldName='KIESTRALEWICZ PAWEŁ',newName='WESTFALEWICZ PAWEŁ';
        const adminHtml=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/matchthis/MatchThis_MT-70.html','utf8');
        function inspect(){
          const e=db.events.find(x=>x.id==='mt2026-traper-cup-kobialka');
          const t=e?.rounds?.[0],sensas=db.events.find(x=>x.id==='mt2026-sensas-challenge-kobialka')?.rounds?.[0];
          if(!t||e.date!=='2026-04-11')throw Error('TRAPER_NOT_FOUND');
          const matches=t.results.filter(r=>r.sector==='A'&&Number(r.peg)===11&&r.competitorId==='mt2026-standalone-kiestralewicz-pawe');
          if(matches.length!==1)throw Error('A11_EXPECTS_ONE_ROW');
          const row=matches[0],player=db.players.find(p=>p.id===row.competitorId);
          return {name:row.competitorName,flag:row.nameNeedsReview,weight:row.weightG,peg:row.peg,
            player:fullName(player),playerFlag:player.nameNeedsReview===true,
            flags:t.results.filter(r=>r.nameNeedsReview===true).length,
            rows:t.results.length,grams:t.results.reduce((a,r)=>a+Number(r.weightG||0),0),
            sensasD47:sensas?.results?.find(r=>r.sector==='D'&&Number(r.peg)===47)?.weightG,
            uniqueIds:new Set(t.results.map(r=>r.competitorId)).size};
        }
        for(const [browserName,engine] of [['Chromium',chromium],['Firefox',firefox]]){
          const browser=await engine.launch({headless:true});
          try{
            const errors=[];
            const publicContext=await browser.newContext({viewport:{width:1450,height:900}});
            const page=await publicContext.newPage();
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto(base,{waitUntil:'networkidle',timeout:60000});
            if(response.status()!==200||await page.title()!=='MatchThis MT-70'||await page.locator('#appversion').innerText()!=='MT-70')
              throw Error(browserName+' DEPLOYED_VERSION_NOT_MT70');
            const actual=await page.evaluate(inspect);
            if(actual.name!==newName||actual.flag!==false||actual.player!==newName||actual.playerFlag!==false||
               actual.flags!==10||actual.rows!==55||actual.grams!==169230||actual.weight!==4285||
               actual.sensasD47!==2830)
              throw Error(browserName+' LIVE_SOURCE_DATA_REGRESSION '+JSON.stringify(actual));
            await page.locator('[data-view="events"]').first().click();
            const open=page.locator('[data-open="'+eventId+'"]');
            if(await open.count()!==1)throw Error(browserName+' TRAPER_LINK_MISSING');
            await open.click();
            await page.locator('[data-result-mode="sectors"]').first().click();
            const body=await page.locator('body').innerText();
            if(!body.includes(newName)||body.includes(oldName))
              throw Error(browserName+' ACTUAL_PUBLIC_UI_NOT_CORRECTED');
            if(await page.locator('[data-action="downloadFbPhoto"],[data-action="mt67DownloadAllDrawSectors"]').count())
              throw Error(browserName+' VIEWER_EXPORT_REGRESSION');
            await page.screenshot({path:'/tmp/mt70-live/MT70_'+browserName+'_TRAPER_A11.png',fullPage:true});
            await publicContext.close();
            // Simulate old MT69 localStorage in a *separate* browser context, never affecting the production site.
            const context=await browser.newContext({viewport:{width:1450,height:900}});
            const test=await context.newPage();
            test.on('pageerror',e=>errors.push(e.message));
            await test.route('**/mt70-test-isolated.html',route=>route.fulfill({status:200,contentType:'text/html',body:adminHtml}));
            await test.goto(base+'mt70-test-isolated.html',{waitUntil:'load',timeout:60000});
            await test.evaluate(()=>{
              const e=db.events.find(x=>x.id==='mt2026-traper-cup-kobialka');
              const r=e.rounds[0].results.find(r=>r.sector==='A'&&r.peg===11);
              r.competitorName='KIESTRALEWICZ PAWEŁ';
              r.nameNeedsReview=true;
              const p=db.players.find(p=>p.id===r.competitorId);
              p.lastName='KIESTRALEWICZ';p.firstName='PAWEŁ';
              p.aliases=['KIESTRALEWICZ PAWEŁ'];p.nameNeedsReview=true;
              localStorage.setItem(MT69_STORAGE_KEY,JSON.stringify(db));
              localStorage.removeItem(STORAGE_KEY);
            });
            await test.reload({waitUntil:'load'});
            const migrated=await test.evaluate(inspect);
            if(JSON.stringify(migrated)!==JSON.stringify(actual))throw Error(browserName+' OLD_STORAGE_MIGRATION_FAILED '+JSON.stringify(migrated));
            const snapshot=await test.evaluate(()=>localStorage.getItem(STORAGE_KEY));
            if(!snapshot)throw Error(browserName+' MT70_AUTOSAVE_MISSING');
            await test.reload({waitUntil:'load'});
            const again=await test.evaluate(inspect);
            if(JSON.stringify(again)!==JSON.stringify(migrated))throw Error(browserName+' NOT_IDEMPOTENT');
            // Regression: a manual override in the old state must not be changed by the automatic correction.
            await test.evaluate(()=>{
              const row=db.events.find(e=>e.id==='mt2026-traper-cup-kobialka').rounds[0].results.find(r=>r.sector==='A'&&r.peg===11);
              row.competitorName='INNA OSOBA';row.nameNeedsReview=false;
              localStorage.setItem(MT69_STORAGE_KEY,JSON.stringify(db));localStorage.removeItem(STORAGE_KEY);
            });
            await test.reload({waitUntil:'load'});
            const override=await test.evaluate(inspect);
            if(override.name!=='INNA OSOBA'||override.weight!==4285)throw Error(browserName+' MANUAL_OVERRIDE_WAS_OVERWRITTEN');
            if(errors.length)throw Error(browserName+' JS_ERRORS '+JSON.stringify(errors));
            await context.close();
            console.log('MT70_REAL_PUBLIC_A11_MIGRATION_RELOAD_MANUAL_OVERRIDE_PASS',
                        browserName,JSON.stringify({name:actual.name,flag:actual.flag,flagsRemaining:actual.flags,
                          rows:actual.rows,grams:actual.grams,sensasD47:actual.sensasD47,errors:0}));
          }finally{await browser.close()}
        }
        JS
    - name: Package all verified MT70 HTML roles and actual browser screenshots
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MatchThis_MT-70_verified
        path: |
          matchthis/MatchThis_MT-70.html
          matchthis/MatchThis_MT-70_OGLADACZ.html
          matchthis/MatchThis_MT-70_SEDZIA.html
          /tmp/mt70-live/MT70_*_TRAPER_A11.png
        if-no-files-found: error
    - name: Rollback only MatchThis to MT69 if any live acceptance test fails
      if: failure() && steps.deploy.outcome == 'success'
      run: bash matchthis/rollback-mt70-small2.sh
