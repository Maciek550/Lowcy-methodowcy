          assert 'MatchThis_MT-65_OGLADACZ.html' in script,kind
          assert ('MT65_VERSION_AUTH_HTTPS_OK' in script if kind=='deploy' else 'MT65_ROLLBACK_MT64' in script),kind
          (D/f'{kind}-mt65-small2.sh').write_text(script,'utf8')
        print('MT65_RELEASE_GUARDS_AND_MT64_ROLLBACK_READY')
        PY
        bash -n matchthis/deploy-mt65-small2.sh
        bash -n matchthis/rollback-mt65-small2.sh
