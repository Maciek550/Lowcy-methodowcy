name: Historical import safety tests
on:
  push:
    branches: [feature/bezpieczny-import-zawodow]
  pull_request:
    paths:
      - 'historical-import/**'
      - 'import-preview.cjs'
      - 'server.cjs'
      - 'app.js'
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: historical_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/historical_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and parsers
        run: |
          node --check server.cjs
          node --check app.js
          node --check historical-import/ui.js
          node --test historical-import/*.test.cjs
      - name: Transactional integration on PostgreSQL
        run: node --test historical-import/integration.cjs
