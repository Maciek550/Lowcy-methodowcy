name: Historical import safety tests
on:
  push:
    branches: [feature/bezpieczny-import-zawodow]
  pull_request:
    paths:
      - 'historical-import/**'
      - 'import-preview.cjs'
      - 'server.cjs'
      - 'app.js'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check server.cjs
          node --check app.js
          node --check historical-import/import-core.cjs
          node --check historical-import/parse-table.cjs
      - name: Historical importer unit tests
        run: node --test historical-import/*.test.cjs
