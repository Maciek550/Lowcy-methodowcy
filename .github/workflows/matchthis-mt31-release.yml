name: MatchThis MT31 isolated SMALL2 release
on:
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: ['.github/workflows/matchthis-mt31-release.yml']
permissions: {contents: read}
jobs:
  publish-matchthis-only:
    runs-on: ubuntu-latest
    env:
      SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy version MT31 to independent MatchThis domain
        run: bash matchthis/deploy-mt31-small2.sh
      - name: Restore MT30 only if deployment or live verification fails
        if: failure()
        run: bash matchthis/rollback-mt31-small2.sh
