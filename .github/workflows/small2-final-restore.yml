name: SMALL2 V311 corrected JSONB restore final
on:
  push:
    branches: [small2-preflight-v311-20261104]
    paths: ['.github/workflows/small2-final-restore.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check corrected importer locally, upload only to SMALL2 private staging
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/small2-restore-db-jsonb-v311.cjs
          node --check deploy/small2-restore-jsonb-final-v311.cjs
          sudo apt-get -qq update && sudo apt-get -qq install -y sshpass
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 10 -t ed25519 s3.small.pl > "$HOME/.ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:mr4Xcr1WrWoINIWGI2KwI3c/KI94+L2hL4FVeCsphh8'
          export SSHPASS="$SSH_PASSWORD"
          opts=(-o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password -o KbdInteractiveAuthentication=yes -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          remote='lowcymethodowcy@s3.small.pl'
          sshpass -e ssh "${opts[@]}" "$remote" 'test ! -e "$HOME/lowcy-small2-stage-v311/restore-db-jsonb-corrected-v311.cjs"'
          sshpass -e scp "${opts[@]}" deploy/small2-restore-db-jsonb-v311.cjs "$remote:lowcy-small2-stage-v311/restore-db-jsonb-corrected-v311.cjs"
          expected="$(sha256sum deploy/small2-restore-db-jsonb-v311.cjs | cut -d' ' -f1)"
          actual="$(sshpass -e ssh "${opts[@]}" "$remote" 'chmod 600 "$HOME/lowcy-small2-stage-v311/restore-db-jsonb-corrected-v311.cjs" && node --check "$HOME/lowcy-small2-stage-v311/restore-db-jsonb-corrected-v311.cjs" && sha256sum "$HOME/lowcy-small2-stage-v311/restore-db-jsonb-corrected-v311.cjs" | cut -d" " -f1')"
          test "$actual" = "$expected"
          echo 'SMALL2_RESTORE_CODE_SHA256_AND_SYNTAX_OK'
          sshpass -e ssh "${opts[@]}" "$remote" 'cd "$HOME/lowcy-small2-20261023" && node -' < deploy/small2-restore-jsonb-final-v311.cjs
