name: MatchThis MT86 - player phone login, history and recovery SMALL2
'on':
  push:
    branches: [matchthis-mt23-independent-small2-20261106]
    paths: [.github/workflows/matchthis-mt86-release.yml]
permissions: {contents: read, actions: read}
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact source, verify immutable MT85 base, and build all three MT86 roles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y brotli
          cat matchthis/mt86-bundle.part0 matchthis/mt86-bundle.part1 matchthis/mt86-bundle.part2 | base64 -d > /tmp/mt86-sources.tar.br
          echo '2ad5499a82d19a567d878fb728305146465268c8733297081a55592cdac24d9f  /tmp/mt86-sources.tar.br' | sha256sum -c -
          mkdir -p /tmp/mt86-sources
          brotli -d -c /tmp/mt86-sources.tar.br | tar -xf - -C /tmp/mt86-sources
          gh run download 43879981621 -R Maciek550/Lowcy-methodowcy -n MatchThis_MT85_VERIFIED_THREE_ROLE_HTML -D /tmp/mt85-source
          for role in '' '_OGLADACZ' '_SEDZIA';do
            cp "$(find /tmp/mt85-source -name "MatchThis_MT-85$role.html" -print -quit)" "matchthis/MatchThis_MT-85$role.html"
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/mt86-sources/build-mt86.py')
          s=p.read_text()
          assert s.count("/mnt/data/mt85_release")==1
          assert s.count("/mnt/data/mt86")==1
          p.write_text(s.replace("/mnt/data/mt85_release","matchthis").replace("/mnt/data/mt86","matchthis"))
          PY
          python3 /tmp/mt86-sources/build-mt86.py
          python3 matchthis/mt86-postbuild.py
          mkdir -p matchthis/server
          cp /tmp/mt86-sources/server/mt86-player-*.php matchthis/server/
          (cd matchthis && sha256sum MatchThis_MT-86*.html)
          for f in matchthis/server/mt86-player-*.php;do php -l "$f";done
          bash -n matchthis/deploy-mt86-small2.sh
          mkdir -p /tmp/mt86-sources/tests/fixture/.mt41-private
          cp matchthis/server/mt86-player-lib.php /tmp/mt86-sources/tests/fixture/.mt41-private/
          php /tmp/mt86-sources/tests/test-lib.php
          python3 - <<'PY'
          import re,subprocess,tempfile
          from pathlib import Path
          for p in Path('matchthis').glob('MatchThis_MT-86*.html'):
           text=p.read_text('utf-8')
           assert text.count('MT-86')>=3 and 'MT-85' not in text
           assert '<title>MatchThis MT-86' in text
           assert 'data-version="MT-86"' in text
           assert "const APP_VERSION='MT-86'" in text
           assert not (p.name.endswith('_OGLADACZ.html') and "['players','ZAWODNICY']" in text)
           for n,script in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',text,re.S|re.I)):
            if not script.strip():continue
            f=Path(tempfile.gettempdir())/(p.name+str(n)+'.js');f.write_text(script)
            subprocess.run(['node','--check',str(f)],check=True)
           print('MT86_VERSION_AND_JS_SYNTAX_PASS',p.name)
          PY
      - name: Install actual Chromium and Firefox for browser regression
        run: |
          python3 -m venv /tmp/mt86-venv
          /tmp/mt86-venv/bin/pip install -q playwright
          /tmp/mt86-venv/bin/python -m playwright install --with-deps chromium firefox
      - name: Exercise anonymous, phone login, own history, logout and responsive layout in both browsers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          f=Path('/tmp/mt86-sources/tests/browser-fixture.py')
          s=f.read_text().replace("Path('/mnt/data/mt86')","Path('matchthis').resolve()")
          f.write_text(s)
          orig=Path('/tmp/mt86-sources/tests/browser-test.py').read_text()
          for engine in ('chromium','firefox'):
           t=orig.replace("p.chromium.launch(executable_path='/usr/bin/chromium',headless=True,args=['--no-sandbox'])",f"p.{engine}.launch(headless=True)")
           t=t.replace('_CHROMIUM_PASS','_'+engine.upper()+'_PASS')
           Path(f'/tmp/mt86-{engine}-test.py').write_text(t)
          PY
          /tmp/mt86-venv/bin/python /tmp/mt86-sources/tests/browser-fixture.py >/tmp/mt86-fixture.log 2>&1 &
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8786/ >/dev/null
          /tmp/mt86-venv/bin/python /tmp/mt86-chromium-test.py
          /tmp/mt86-venv/bin/python /tmp/mt86-firefox-test.py
      - name: Deploy only MatchThis with exact MT85 backup and unchanged state, admin and judge accounts
        id: deploy
        env:
          SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: bash matchthis/deploy-mt86-small2.sh
      - name: Verify production public view, server guards, unchanged results and browser console in both engines
        run: |
          set -euo pipefail
          cat >/tmp/mt86-live.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          URL='https://matchthis.lowcymethodowcy.smallhost.pl/'
          async def main():
           async with async_playwright() as p:
            for engine in (p.chromium,p.firefox):
             browser=await engine.launch()
             try:
              page=await browser.new_page(viewport={'width':1366,'height':900})
              errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              await page.goto(URL,wait_until='domcontentloaded')
              await page.wait_for_function("document.querySelector('#mt73-sync')?.textContent.includes('Dane z serwera')",timeout=30000)
              assert await page.title()=='MatchThis MT-86'
              assert await page.locator('#nav [data-view="players"]').count()==0
              assert await page.locator('#nav [data-view="profile"]').count()==0
              await page.locator('#mtLoginOpen').click()
              assert await page.locator('#mt86-player-form').is_visible()
              await page.locator('#mt86-tab-admin').click()
              assert await page.locator('#mtLoginForm').is_visible()
              await page.locator('#mt86-tab-player').click()
              assert not errors,errors
              print('MT86_LIVE_PUBLIC_NO_PLAYERS_ADMIN_AND_PLAYER_LOGIN_TABS_PASS',engine.name)
             finally:await browser.close()
          asyncio.run(main())
          PY
          /tmp/mt86-venv/bin/python /tmp/mt86-live.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MatchThis_MT86_VERIFIED_THREE_ROLE_HTML
          path: matchthis/MatchThis_MT-86*.html
          if-no-files-found: error
      - name: Roll back to original MT85 on post-deployment test failure, never overwrite account store
        if: failure() && steps.deploy.outcome == 'success'
        env:
          SSH_PASSWORD: ${{ secrets.SMALL2_SSH_PASSWORD }}
        run: bash matchthis/deploy-mt86-small2.sh rollback
