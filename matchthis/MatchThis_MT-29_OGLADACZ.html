<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MatchThis MT-29</title>
<style>
/* MatchThis R6 — kolorystyka i proporcje zgodne z referencją matchthis.pl:
   grafit #2c2e35, pomarańcz #e96609; bez zmian logiki i danych. */
:root{
  font:14px/1.42 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:#22252b;background:#f4f4f4;
  --ink:#22252b;--muted:#626772;--surface:#fff;--edge:#dedfe1;
  --dark:#2c2e35;--accent:#e96609;--accent-dark:#c85000;--soft:#fff4e9;
  --focus:#e96609;--panel-shadow:0 2px 11px rgba(24,25,28,.045)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}body{margin:0;min-width:0}
button,input,select,textarea{font:inherit}button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px
}
.top{
  position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #dfe0e4;
  padding:12px max(16px,calc((100vw - 1440px)/2));display:flex;
  align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 4px #1111
}
.brand{color:#2c2e35;font-size:29px;font-weight:400;letter-spacing:.045em;line-height:1.02;white-space:nowrap}
.brand b{color:var(--accent);font-weight:800}
.version{font-size:10px;color:#65666a;margin-top:4px;letter-spacing:.045em}
.tag{display:inline-block;padding:5px 7px;border-radius:0;background:#f3f3f3;color:#44474d;font-size:9px;font-weight:750;letter-spacing:.095em;vertical-align:middle}
.shell{max-width:1440px;margin:auto;display:grid;grid-template-columns:215px minmax(0,1fr);min-height:calc(100vh - 195px);background:#f5f5f5}
nav{background:#fff;border-right:1px solid #dfe0e4;padding:13px 10px 22px;min-width:0}
nav h3{margin:17px 9px 6px;color:#88898d;text-transform:uppercase;font-size:10px;letter-spacing:.10em;font-weight:800}
nav button,.sidebtn{
  display:block;width:100%;text-align:left;border:0;border-radius:3px;
  color:#2c2e35;background:transparent;font-size:12px;font-weight:750;letter-spacing:.025em;
  padding:9px 10px;margin:2px 0;transition:background .12s,color .12s
}
nav button:hover,.sidebtn:hover{background:#f2f2f2}
nav button.active{background:var(--dark);color:#fff;box-shadow:inset 4px 0 var(--accent)}
.sidebtn span{display:block;color:#747579;font-size:11px;font-weight:450;margin-top:2px}
nav button.active span{color:#ddd}
.main{min-width:0;padding:17px 20px 42px}
h1{color:#23252a;font-size:23px;letter-spacing:-.02em;font-weight:800;margin:0 0 5px}
h2{color:#2c2e35;font-size:17px;letter-spacing:-.01em;font-weight:750;margin:0 0 12px}
p{color:var(--muted)}.sub{color:var(--muted);margin:0 0 15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{
  min-width:0;background:#fff;border:1px solid var(--edge);border-radius:3px;
  padding:15px;margin-bottom:12px;box-shadow:var(--panel-shadow)
}
.stat{background:#fff;border:1px solid #dedfe1;border-top:3px solid var(--accent);border-radius:4px;padding:10px 12px;color:#555b62;font-size:12px}
.stat b{display:block;color:#161718;font-size:22px}
label{display:block;font-size:12px;font-weight:650;margin-bottom:6px;color:#393b3d}
input,textarea,select{min-width:0;width:100%;padding:9px 10px;color:#222428;background:#fff;border:1px solid #bfc2c5;border-radius:3px}
input:hover,textarea:hover,select:hover{border-color:#797d82}
input::placeholder,textarea::placeholder{color:#85888e}
textarea{min-height:130px;resize:vertical;font:12px/1.5 ui-monospace,Consolas,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{margin:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:36px;
  padding:8px 12px;background:var(--accent);color:#fff;border:1px solid var(--accent);
  border-radius:3px;font-weight:800;text-decoration:none;transition:background .12s,border-color .12s
}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.secondary{background:#fff;color:#2d2e30;border:1px solid #a9adb2}
.btn.secondary:hover{background:#f2f2f3;border-color:#555b62}
.btn.danger{background:#b3261e;border-color:#b3261e;color:#fff}
.btn.danger:hover{background:#8d1e1a}
.btn.small{min-height:30px;padding:5px 8px;font-size:12px}
.muted{color:#797b81}
.kpi{background:#f8f8f8;border-left:3px solid var(--accent);font-weight:800;border-radius:2px;padding:10px}
.kpi small{display:block;color:#687078;font-weight:450}
.tablewrap{overflow:auto;max-width:100%;border:1px solid #dfe0e0;border-radius:3px;overscroll-behavior-x:contain}
table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}
th{background:#27292c;color:#fff;font-size:11px;font-weight:750;letter-spacing:.025em;position:sticky;top:0}
th,td{padding:7px 9px;border-bottom:1px solid #e3e4e5;white-space:nowrap}
tbody tr:nth-child(2n){background:#f8f8f8}
tbody tr:hover{background:#fff4ea}
.pill{display:inline-flex;align-items:center;background:#fff1e5;color:#a74300;font-size:11px;font-weight:750;padding:3px 6px;border-radius:2px}
.pill.warn{background:#fff0de;color:#8c4d06}
.notice{background:#fff4e9;border-left:3px solid var(--accent);border-radius:2px;color:#704219;padding:10px 12px;margin:12px 0}
.notice.ok{background:#edf8f0;border-color:#32825b;color:#245536}
.date{color:#75767b;font-size:11px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rounds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rounds button{background:#fff;color:#313337;border:1px solid #b9bdc2;border-radius:3px;padding:7px 11px;font-size:12px;font-weight:750}
.rounds button.active{background:#292a2d;color:#fff;border-color:#292a2d;box-shadow:inset 0 -3px var(--accent)}
.archival{border:1px solid #dfdfe0;border-left:3px solid var(--accent);background:#fff;color:#27282a;border-radius:3px;padding:10px 12px;margin:5px 0;width:100%;min-width:0;min-height:72px;box-sizing:border-box;text-align:left;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;white-space:normal;overflow-wrap:break-word;line-height:1.3}
.archival:hover{border-color:#e96609;background:#fff8f0}
.archival b{color:#b84b05;display:block;width:100%;font-size:14px;font-weight:700;line-height:1.35;white-space:normal;overflow-wrap:break-word}.archival .date{display:block;width:100%;font-size:11px;line-height:1.4;color:#626a73;white-space:normal;overflow-wrap:break-word}
.flash{position:fixed;bottom:14px;right:14px;background:#4b3a2e;color:#fff;border:1px solid #a75d21;box-shadow:0 3px 25px #1114;border-radius:3px;padding:11px 13px;z-index:12;max-width:450px}
.flash.good{background:#23623e;border-color:#379963}
.hide{display:none!important}
.smallprint{color:#73767a;font-size:11px;margin-top:11px}
hr{border:0;border-top:1px solid #ddd;margin:12px 0}
input[type="checkbox"]{width:18px;height:18px;min-width:18px;accent-color:var(--accent);cursor:pointer}
#playerForm label{min-width:0}.pill .btn{padding:2px 5px;min-height:22px;margin-left:5px}
.history-link{color:#a94500;border:0;background:none;padding:0;font-weight:780;text-align:left;text-decoration:underline;text-decoration-color:#e1a676;text-underline-offset:3px}
.history-link:hover{color:#7a2e00}
.history-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:9px}
.history-head h2{margin:0}.history-event{break-inside:avoid}
@media(max-width:800px){
  .shell{grid-template-columns:1fr;min-height:calc(100vh - 54px)}
  nav{border-right:0;border-bottom:1px solid #ddd;display:flex;gap:5px;overflow-x:auto;padding:7px 8px;align-items:center;scrollbar-width:thin}
  nav h3,nav p{display:none}
  nav button{white-space:nowrap;width:auto;flex:none;font-size:12px;padding:8px 11px}
  nav button.active{box-shadow:inset 0 -3px var(--accent)}
  nav .archival{display:flex;align-items:center;gap:5px;flex:none;width:auto;margin:0;padding:5px 7px}
  nav .archival b{font-size:11px}
  nav .sidebtn{width:auto;min-width:80px;max-width:158px;white-space:normal;line-height:1.2;font-size:11px;padding:6px;margin:0}
  nav .sidebtn span{font-size:10px}
  .main{padding:12px}.top{padding:9px 12px}.brand{font-size:22px}.version{font-size:9px}
  .grid,.g3,.split{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:390px){.top{align-items:flex-start}.top>.row{gap:4px}.top .btn.small,.top label.btn.small{padding:5px 6px;font-size:10px}.brand{font-size:21px}.tag{font-size:8px;padding:3px 4px}}

/* Wzorowane na matchthis.pl: grafitowy pasek, jasny nagłówek i ciemny baner. */

@media(max-width:800px){
 .utility-strip{height:26px;font-size:9px}

}

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeName(s){return escapeHtml(s).slice(0,250)}
function norm(s){return String(s).trim().normalize('NFKC').toLowerCase().replace(/\s+/g,' ')}

function mergeDatabase(source){
 if(!source || !Array.isArray(source.cycles)||!Array.isArray(source.events))throw new Error('Brak prawidłowej struktury archiwum');
 const remap=new Map();let playersAdded=0,eventsAdded=0,cyclesAdded=0;
 for(const person of source.players||[]){
  const byId=db.players.find(p=>p.id===person.id);
  const same=db.players.filter(p=>norm(fullName(p))===norm([person.lastName,person.firstName].join(' ')) && norm(p.club||'')===norm(person.club||''));
  const found=byId||(same.length===1?same[0]:null);
  if(found){remap.set(person.id,found.id);continue;}
  db.players.push({...person,aliases:[...(person.aliases||[])]});remap.set(person.id,person.id);playersAdded++;
 }
 const mapId=id=>remap.get(id)||id;
 for(const incoming of source.cycles){
  if(db.cycles.some(x=>x.id===incoming.id))continue;
  const entity=JSON.parse(JSON.stringify(incoming));
  entity.entrantIds=(entity.entrantIds||[]).map(mapId);
  for(const t of entity.tours||[])for(const r of t.results||[])r.competitorId=mapId(r.competitorId);
  if(entity.officialRows){const changed={};for(const [id,value] of Object.entries(entity.officialRows))changed[mapId(id)]=value;entity.officialRows=changed;}
  db.cycles.push(entity);cyclesAdded++;
 }
 for(const incoming of source.events){
  if(db.events.some(x=>x.id===incoming.id))continue;
  const entity=JSON.parse(JSON.stringify(incoming));entity.entrantIds=(entity.entrantIds||[]).map(mapId);
  for(const t of entity.rounds||[]){if(entity.archived)t.drawPublished=false;for(const r of t.results||[])r.competitorId=mapId(r.competitorId);}
  db.events.push(entity);eventsAdded++;
 }
 save();return {playersAdded,cyclesAdded,eventsAdded};
}
// R12: fill only missing historical sector/peg assignments from verified source sheets.
// No scores, weights, identities, user-edited sector/peg values, or future results are overwritten.
function enrichArchivedSectorAssignments(){
 const source=MATCHTHIS_ARCHIVE_2026.data.cycles.find(c=>c.id==='mt2026-mega-match-this-cup-cycle');
 const target=db.cycles.find(c=>c.id===source?.id);
 if(!target)return 0;
 const personById=new Map(MATCHTHIS_ARCHIVE_2026.data.players.map(p=>[p.id,p]));
 const byName=new Map(db.players.map(p=>[norm(fullName(p)),p.id]));
 let added=0;
 for(let idx of [0,1,3]){
  const st=source?.tours?.[idx], tt=target?.tours?.[idx];
  if(!st||!tt || tt.sourceOfficial!==true)continue;
  const tmap=new Map(tt.results.map(r=>[String(r.competitorId),r]));
  for(const entry of st.results){
   if(!entry.sector||!entry.peg)continue;
   const person=personById.get(entry.competitorId);if(!person)continue;
   const targetId=byName.get(norm([person.lastName,person.firstName].join(' ')));
   if(!targetId)continue;
   const r=tmap.get(String(targetId));if(!r)continue;
   if(r.sector || r.peg || r.absent || r.officialPlace===100)continue;
   // This record must still be the same official archived result before we enrich it.
   if(Number(r.weightG)!==Number(entry.weightG) || Number(r.officialPlace)!==Number(entry.officialPlace))continue;
   if(tt.results.some(other=>other!==r && Number(other.peg)===Number(entry.peg)))continue;
   r.sector=entry.sector;r.peg=entry.peg;r.sectorSource='oryginalny arkusz sektorowy';added++;
  }
 }
 if(added)save();return added;
}

const MT26_SENSAS_VERIFIED=[{"sector":"A","peg":3,"weightG":3730,"oldName":"KURACZYK ŁUKASZ","newName":"KRAWCZYK ŁUKASZ (MŁAWA)"},{"sector":"A","peg":8,"weightG":2920,"oldName":"GRYB ROBERT","newName":"GRZYB ROBERT"},{"sector":"A","peg":10,"weightG":3160,"oldName":"KIEŁBASZ JAN","newName":"KIEBASZ JAN"},{"sector":"B","peg":19,"weightG":2620,"oldName":"ŁUSZCZEWSKA EMILIA","newName":"ŁUSZCZEWSKA EMILIA"},{"sector":"B","peg":22,"weightG":1845,"oldName":"BŁAŻEJCZAK ADAM","newName":"BŁAŻEJCZAK ADAM"},{"sector":"B","peg":23,"weightG":1030,"oldName":"GRADYSZEWSKI ZBIGNIEW","newName":"GŁADYSZEWSKI ZBIGNIEW"},{"sector":"C","peg":26,"weightG":3095,"oldName":"KOŁAKOWSKI ARTUR","newName":"KRÓLIKOWSKI ARTUR"},{"sector":"C","peg":28,"weightG":2130,"oldName":"KRAJEWSKI ANDRZEJ","newName":"KRAJEWSKI ANDRZEJ"},{"sector":"C","peg":29,"weightG":5135,"oldName":"KĘDZIEWSKI KRZYSZTOF","newName":"KĘDZIERSKI KRZYSZTOF"},{"sector":"C","peg":34,"weightG":5000,"oldName":"LASAK TOMASZ","newName":"LASZUK TOMASZ"},{"sector":"C","peg":36,"weightG":2150,"oldName":"JAGIEŁŁO OLGA","newName":"JAGIEŁŁO OLGA"},{"sector":"D","peg":42,"weightG":3180,"oldName":"LEWANDOWSKI WOJCIECH","newName":"LEWANDOWSKI WOJCIECH"},{"sector":"D","peg":45,"weightG":2980,"oldName":"WESTFALEWICZ PAWEŁ","newName":"WESTFALEWICZ PAWEŁ"},{"sector":"E","peg":52,"weightG":2585,"oldName":"LISK OSKAR","newName":"LISEK OSKAR"},{"sector":"E","peg":56,"weightG":3715,"oldName":"DUDAGA JAKUB","newName":"DERLAGA JAKUB"},{"sector":"E","peg":58,"weightG":1965,"oldName":"TOSNOWIEC MARCIN","newName":"TOSNOWIEC MARCIN"},{"sector":"E","peg":59,"weightG":1910,"oldName":"ŁYK MACIEJ","newName":"ŁYK MACIEJ"},{"sector":"E","peg":60,"weightG":7000,"oldName":"MAZIURAK GRZEGORZ","newName":"MAZURCZAK GRZEGORZ"},{"sector":"F","peg":62,"weightG":2585,"oldName":"KUCHARZYK ŁUKASZ","newName":"KRAWCZYK ŁUKASZ (ZAMOŚĆ)"},{"sector":"F","peg":64,"weightG":1365,"oldName":"OPOROWICZ MIROSŁAW","newName":"OWCZARCZUK MIROSŁAW"},{"sector":"F","peg":65,"weightG":2445,"oldName":"WITMAN ADAM","newName":"WILLMAN ADAM"},{"sector":"F","peg":66,"weightG":2000,"oldName":"ZIMNIEWICZ PIOTR","newName":"ZIMNIEWICZ PIOTR"},{"sector":"F","peg":71,"weightG":5500,"oldName":"LEWANDOWSKI ARTUR","newName":"LEWANDROWSKI ARTUR"}];
function applyMt26SensasVerification(){
 const event=db.events.find(e=>e.id==='mt2026-sensas-challenge-kobialka');
 const rows=event?.rounds?.[0]?.results;
 if(!rows)return 0;
 let changed=0;
 for(const patch of MT26_SENSAS_VERIFIED){
  const row=rows.find(r=>r.sector===patch.sector && Number(r.peg)===patch.peg);
  if(!row || Number(row.weightG)!==patch.weightG || ![patch.oldName,patch.newName].includes(row.competitorName))continue;
  const oldName=row.competitorName;
  if(oldName!==patch.newName){row.competitorName=patch.newName;changed++;}
  if(row.nameNeedsReview){row.nameNeedsReview=false;changed++;}
  const person=db.players.find(p=>p.id===row.competitorId);
  if(person){
   const full=[person.lastName||'',person.firstName||''].join(' ').trim();
   const otherResults=db.events.flatMap(e=>e.rounds||[]).flatMap(t=>t.results||[]).filter(r=>r!==row && r.competitorId===row.competitorId);
   const sharedDifferent=otherResults.some(r=>r.competitorName!==patch.newName);
   if(!sharedDifferent && patch.oldName!==patch.newName && full===patch.oldName){
    const [surname,...forename]=patch.newName.split(' ');person.lastName=surname;person.firstName=forename.join(' ');
    person.aliases=[...(person.aliases||[]).filter(x=>x!==patch.oldName)];
    if(!person.aliases.includes(patch.newName))person.aliases.push(patch.newName);
    changed++;
   }
   if(person.nameNeedsReview && !otherResults.some(r=>r.nameNeedsReview)){
    person.nameNeedsReview=false;changed++;
   }
  }
 }
 if(changed)save();
 return changed;
}
const mt26AutoVerified=applyMt26SensasVerification();

// MT-27: source-verified A7 weight, and JAROS ARTUR confirmed independently in SENSAS and TRAPER.
// Update only exact old values in the intended event, sector and station.
function applyMt27SourceDecisions(){
 const sensas=db.events.find(e=>e.id==='mt2026-sensas-challenge-kobialka');
 const traper=db.events.find(e=>e.id==='mt2026-traper-cup-kobialka');
 if(!sensas || !traper)return 0;
 const sr=sensas.rounds?.[0]?.results||[];
 const tr=traper.rounds?.[0]?.results||[];
 const row=(rs,sector,peg)=>rs.find(r=>r.sector===sector && Number(r.peg)===peg);
 let changes=0;
 const a7=row(sr,'A',7), b24=row(sr,'B',24), d46=row(tr,'D',46);
 if(a7 && a7.competitorName==='KUCHCIAK JACEK' && Number(a7.weightG)===5520){a7.weightG=5570;changes++;}
 for(const entry of [[b24,'B',24,4135],[d46,'D',46,2650]]){
  const [r,sector,peg,weightG]=entry;
  if(!r||r.sector!==sector||Number(r.peg)!==peg||Number(r.weightG)!==weightG||r.competitorId!=='mt2026-standalone-jarosz-artur')continue;
  if(r.competitorName==='JAROSZ ARTUR') {r.competitorName='JAROS ARTUR';changes++;}
 }
 if(b24?.competitorName==='JAROS ARTUR' && d46?.competitorName==='JAROS ARTUR' && b24.competitorId===d46.competitorId){
  const person=db.players.find(p=>p.id===b24.competitorId);
  if(person && person.lastName==='JAROSZ' && person.firstName==='ARTUR'){
   person.lastName='JAROS';
   person.aliases=[...(person.aliases||[]).map(a=>a==='JAROSZ ARTUR'?'JAROS ARTUR':a)];
   if(!person.aliases.includes('JAROS ARTUR'))person.aliases.push('JAROS ARTUR');
   changes++;
  }
 }
 if(changes)save();
 return changes;
}
const mt27AutoCorrections=applyMt27SourceDecisions();

 const id=editingPlayerId; const duplicate=activePlayers().find(p=>p.id!==id&&norm(p.firstName||'')===norm(firstName)&&norm(p.lastName||'')===norm(lastName)&&norm(p.club||'')===norm(club));

// Profil historii nie jest osobną kopią danych: jest wyliczany ze startów i klasyfikacji.
function playerForResult(row){
 const exact=db.players.find(p=>String(p.id)===String(row.competitorId));
 if(exact)return exact.id;
 const key=norm(row.competitorName||'');
 if(!key)return null;
 const matched=db.players.filter(p=>playerNames(p).some(n=>norm(n)===key));
 return matched.length===1?matched[0].id:null; // homonimy nigdy nie są automatycznie scalane
}
function playerHistory(personId){
 const player=findPlayer(personId);if(!player)return [];
 return allEntities().map(entity=>{
  const tours=getRounds(entity),rows=[];
  tours.forEach((tour,index)=>{
   const ranked=core.tourClassification(tour);
   const matching=ranked.find(r=>playerForResult(r)===personId);
   if(matching)rows.push({tourId:tour.id,tourName:tour.name||('Tura '+(index+1)),tourNumber:index+1,date:tour.date||entity.date||'',sector:matching.sector,sectorSize:matching.sectorSize,place:matching.place,peg:matching.peg,weightG:matching.weightG,status:tour.status,absent:core.isNonStarter(matching),sourceOfficial:!!tour.sourceOfficial});
  });
  if(!rows.length && !(entity.entrantIds||[]).includes(personId))return null;
  const cycle=entity.type==='cycle';const classified=cycle?core.cycleClassification(entity):core.eventClassification(entity);
  const classification=classified.rows.find(r=>playerForResult(r)===personId);
  const countedIds=new Set(cycle?(classification?.counted||[]).map(z=>z.tourId):[]);
  const droppedIds=new Set(cycle?(classification?.dropped||[]).map(z=>z.tourId):[]);
  const date=rows.map(r=>r.date).filter(Boolean).sort().at(-1)||entity.date||String(entity.year)+'-01-01';
  return {id:entity.id,name:entity.name,year:entity.year,date,kind:entity.type==='cycle'?'CYCLE':(entity.kind||'EVENT'),type:entity.type,
    archived:!!entity.archived,provisional:cycle?!classified.complete:classified.provisional,
    rank:classification?.rank??null,points:cycle?classification?.pointSum:classification?.points,
    totalWeightG:cycle?classification?.weightG:classification?.weightG,
    rows:rows.map(r=>({...r,counted:countedIds.has(r.tourId),dropped:droppedIds.has(r.tourId)})),
    confirmedTours:rows.filter(r=>r.status==='FINAL'&&!r.absent).length,
    pending:rows.length===0};
 }).filter(Boolean).sort((a,b)=>b.date.localeCompare(a.date)||b.year-a.year||a.name.localeCompare(b.name,'pl'));
}

function archivedYearEntries(){
 const items=[...db.cycles.map(c=>({entity:c,type:'cycle'})),...db.events.map(e=>({entity:e,type:'event'}))];
 const ys=new Set([2025,2026]);
 items.forEach(x=>{const n=Number(x.entity.year);if(Number.isInteger(n)&&n>=2000&&n<=2100)ys.add(n)});
 return [...ys].sort((a,b)=>b-a).map(year=>{
  const match=items.filter(x=>Number(x.entity.year)===year);
  const cycles=match.filter(x=>x.type==='cycle').sort((a,b)=>String(a.entity.name).localeCompare(String(b.entity.name),'pl'));
  const events=match.filter(x=>x.type==='event');
  const linked=new Set(events.filter(x=>x.entity.cycleId&&cycles.some(c=>c.entity.id===x.entity.cycleId)).map(x=>x.entity.id));
  const others=events.filter(x=>!linked.has(x.entity.id)).sort((a,b)=>String(b.entity.date||'').localeCompare(String(a.entity.date||''))||String(a.entity.name).localeCompare(String(b.entity.name),'pl'));
  return {year,cycles,events,linked,others};
 });
}
function yearItemButton(item,shortLabel=''){
 const e=item.entity, tourCount=getRounds(e).length;
 const kind=item.type==='cycle'?'Cykl':e.kind==='FINAL'?'Finał':'Zawody';
 const date= e.date||String(e.year),label=shortLabel||e.name;
 return `<button class="year-item" data-open="${escapeHtml(e.id)}" data-type="${item.type}"><b>${safeName(label)}</b><span>${safeName(date)} · ${tourCount} ${tourCount===1?'tura':'tur'} · ${kind} · Wyniki i klasyfikacja</span></button>`;
}

 ${years.map(group=>{
  const {year,cycles,events,others}=group;
  let html='';
  if(cycles.length){
   html+=`<div class="year-group-title">CYKLE I FINAŁY</div>`;
   html+=cycles.map(c=>{

    return `<div class="year-cycle">${yearItemButton(c)}${links.map(e=>yearItemButton(e)).join('')}</div>`;
   }).join('');
  }
  if(others.length){
   html+=`<div class="year-group-title">ZAWODY NIEZALEŻNE</div><div class="year-entries">${others.map(e=>yearItemButton(e)).join('')}</div>`;
  }

   html=`<p class="year-no-results"><strong>Brak zweryfikowanych wyników z ${year} r.</strong> Po wprowadzeniu zawodów i ich wyników pojawią się tutaj wszystkie tury, sektory i klasyfikacje. Niczego nie dopisano na podstawie domysłów.</p>`;
  }
  return `<details class="year-fold" data-year="${year}" name="matchthis-year-groups" ${year===expandedYear?'open':''}>
   <summary><strong>${year}</strong><span class="year-count">${cycles.length} ${cycles.length===1?'cykl':'cykli'} · ${events.length} ${events.length===1?'zawody':'zawodów/finałów'}</span><span class="year-chevron" aria-hidden="true">⌄</span></summary>
   <div class="year-fold-inner">${html}</div></details>`;
 }).join('')}</section>`;
}

function photoCandidates(){
 return [...db.cycles.map(entity=>({entity,type:'cycle'})),...db.events.map(entity=>({entity,type:'event'}))]
  .map(({entity,type})=>({entity,type,rounds:getRounds(entity).map((tour,index)=>{
   let sectors=[];
   try{const rows=core.tourClassification(tour).filter(r=>!core.isNonStarter(r));sectors=[...new Set(rows.map(r=>r.sector).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));}catch(_e){}
   return {tour,index,sectors};}).filter(x=>x.sectors.length)})).filter(x=>x.rounds.length);
}
function getPhotoSelection(){
 const options=photoCandidates();
 if(!options.length)return null;
 let selected=options.find(x=>x.entity.id===photoEntityId)||options[0];
 if(photoEntityId!==selected.entity.id){photoEntityId=selected.entity.id;photoRoundIndex=selected.rounds[0].index;photoSector='ALL';}
 let chosenRound=selected.rounds.find(x=>x.index===photoRoundIndex)||selected.rounds[0];
 photoRoundIndex=chosenRound.index;
 if(photoSector!=='ALL'&&!chosenRound.sectors.includes(photoSector))photoSector='ALL';
 const sector=photoSector==='ALL'?chosenRound.sectors[0]:photoSector;
 return {...selected,options,chosenRound,sector,sectors:chosenRound.sectors};
}

function tableRows(rows,columns){return `<div class="tablewrap"><table><thead><tr>${columns.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${columns.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${columns.length}" class="muted">Brak zatwierdzonych wyników</td></tr>`}</tbody></table></div>`}
function fmt(v){return Number.isInteger(v)?String(v):Number(v).toFixed(1).replace('.',',')}
function weightText(value){return String(Math.trunc(Number(value)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}

function rankingCompetitor(x){
 const id=playerForResult({competitorId:x.competitorId,competitorName:x.competitorName});
 const name=safeName(x.competitorName||'—');
 return id?`<button class="history-link" data-profile-player="${escapeHtml(id)}" title="Historia zawodnika">${name}</button>`:name;
}
function summaryTable(rows,kind,rounds=[]){
 const cycle=kind==='cycle';
 const roundCount=rounds.length || (cycle?6:2);
 const columns=Array.from({length:roundCount},(_,i)=>`<th class="points-column" title="Punkty, sektor i stanowisko tury ${i+1}">Tura ${i+1}<small class="round-label">pkt / sek. / st.</small></th>`).join('');
 const mobileRows=[];
 return `<div class="tablewrap"><table class="summary-table ${cycle?'summary-cycle':'summary-event'}"><thead><tr><th>M.</th><th>Zawodnik</th>${columns}<th>Suma pkt</th><th>Waga (g)</th></tr></thead><tbody>${rows.map(x=>{
  const countedIds=new Set(cycle?(x.counted||[]).map(z=>String(z.tourId)):[]);
  const mobileCells=[];
  const cells=Array.from({length:roundCount},(_,i)=>{
   const tour=rounds[i];
   const entry=cycle?(x.entries||[]).find(z=>String(z.tourId)===String(tour?.id)):(x.results||[]).find(z=>z.round===i+1);
   const value=entry?fmt(entry.place):'—';
   const state=cycle&&entry?(countedIds.has(String(entry.tourId))?'counted-tour':'dropped-tour'):'';
   const desc=cycle&&entry?(state==='counted-tour'?'Liczona do sumy':'Odrzucona z sumy'):'';
   // Core classification intentionally keeps score only. Get original sector/peg
   // by stable competitor ID from the same round; never infer or invent locations.
   const original=(tour?.results||[]).find(r=>String(r.competitorId)===String(x.competitorId));
   const absent=!!original && core.isNonStarter(original);
   const sector=original?.sector&&original.sector!=='—'?safeName(original.sector):'—';
   const peg=Number.isInteger(Number(original?.peg))&&Number(original?.peg)>0?String(original.peg):'—';
   const locator=entry ? (absent ? 'nie start.' : (sector==='—'&&peg==='—'?'brak danych':sector+' / '+peg)) : '—';
   mobileCells.push(`<div class="mobile-tour-cell ${state}" title="${desc}"><div class="mobile-tour-top"><span>T${i+1}</span><b>${value} pkt</b></div><div class="mobile-tour-bottom">${locator}</div></div>`);
   return `<td class="points-column ${state}" title="${desc}"><span class="round-score">${value}</span><span class="round-locator">${locator}</span></td>`;
  }).join('');
  const rank=x.rank===null||x.rank===undefined?'—':fmt(x.rank);
  const total=fmt(cycle?x.pointSum:x.points);
  const weight=weightText(x.weightG);
  mobileRows.push(`<article class="mobile-rank-entry"><div class="mobile-rank-top"><span class="mobile-rank-pos">${rank}</span><div class="mobile-rank-name">${rankingCompetitor(x)}</div><div class="mobile-rank-totals"><b>${total} pkt</b><span>${weight} g</span></div></div><div class="mobile-rounds">${mobileCells.join('')}</div></article>`);
  return `<tr><td class="pos">${rank}</td><td class="name-cell">${rankingCompetitor(x)}</td>${cells}<td class="weight points-total">${total}</td><td class="weight weight-value">${weight}</td></tr>`;
 }).join('')}</tbody></table></div><div class="summary-mobile-list" aria-label="Klasyfikacja z punktami wszystkich tur, sektorami i stanowiskami">${mobileRows.join('')}</div>`;
}
const MT21_OVERALL_PAGE_SIZE=15;
function overallPhotoData(e,cycle){
 const result=cycle?core.cycleClassification(e):core.eventClassification(e);
 const rounds=getRounds(e);
 const rows=result.rows;
 const pageCount=Math.max(1,Math.ceil(rows.length/MT21_OVERALL_PAGE_SIZE));
 overallPhotoPage=Math.max(0,Math.min(overallPhotoPage,pageCount-1));
 return {rows,rounds,pageCount,cycle,page:overallPhotoPage,shown:rows.slice(overallPhotoPage*MT21_OVERALL_PAGE_SIZE,(overallPhotoPage+1)*MT21_OVERALL_PAGE_SIZE)};
}
function renderOverallPhoto(e,cycle){
 const data=overallPhotoData(e,cycle);
 return `<section class="panel fb-panel"><div class="result-title"><h2>FOTO FB — klasyfikacja ${cycle?'cyklu':'zawodów'}</h2><span class="pill">JPG 1080 × 1350 · ${data.pageCount} stron</span></div>
 <div class="overall-photo-nav noprint"><div class="row"><button class="btn small secondary" data-overall-photo-page="${data.page-1}" ${data.page===0?'disabled':''}>Poprzednia</button><b>Strona ${data.page+1} / ${data.pageCount}</b><button class="btn small secondary" data-overall-photo-page="${data.page+1}" ${data.page>=data.pageCount-1?'disabled':''}>Następna</button></div><button class="btn" data-action="downloadOverallFbPhoto">Pobierz JPG tej strony</button></div>
 <p class="smallprint">Każde zdjęcie przedstawia 15 kolejnych pozycji klasyfikacji, z punktami tur, sumą i wagą. Pobrane pliki mają kolejne numery.</p>
 <div class="fb-overall-wrap"><canvas id="fbOverallCanvas" width="1080" height="1350" aria-label="Foto FB klasyfikacji ogólnej"></canvas></div></section>`;
}
function drawOverallFbPreview(){requireAdmin();
 const canvas=document.getElementById('fbOverallCanvas');if(!canvas)return;
 const e=current(),cycle=page==='cycle',data=overallPhotoData(e,cycle);
 const ctx=canvas.getContext('2d'),W=1080,H=1350;
 canvas.width=W;canvas.height=H;
 const orange='#e96609',dark='#2c2e35',border='#b9c1c9';
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 ctx.fillStyle=dark;ctx.fillRect(9,9,1062,191);
 ctx.fillStyle=orange;ctx.fillRect(9,9,1062,5);
 function tx(v,x,y,size,weight=500,color=dark,align='left',maxW=null){
  ctx.fillStyle=color;ctx.textAlign=align;ctx.font=`${weight} ${size}px Arial, sans-serif`;
  if(maxW)ctx.fillText(String(v),x,y,maxW);else ctx.fillText(String(v),x,y);
 }
 tx('MATCH',36,63,39,650,'#fff');tx('THIS',198,63,39,650,orange);
 tx(cycle?'KLASYFIKACJA CYKLU':'KLASYFIKACJA ZAWODÓW',1041,61,20,600,'#e0e2e6','right');
 const title=String(e.name).toUpperCase();
 tx(title,36,130,40,560,'#fff','left',1000);
 tx(`${e.year} · ${cycle?'6 TUR / 4 LICZONE':data.rounds.length+' TUR'} · STRONA ${data.page+1}/${data.pageCount}`,36,175,22,500,'#d7d9dc');
 ctx.fillStyle=orange;ctx.fillRect(9,202,1062,68);
 tx('WYNIKI KOŃCOWE',36,246,34,650,'#fff');tx(`${data.rows.length} ZAWODNIKÓW`,1040,243,21,500,'#fff','right');
 const x=[25,86,421],right=1054;
 const extra=data.rounds.length;
 const endWidth=128,sumWidth=115;
 const tourAvail=right-x[2]-endWidth-sumWidth;
 const tourW=tourAvail/Math.max(extra,1);
 for(let i=1;i<=extra;i++)x.push(x[2]+i*tourW);
 x.push(right-endWidth);x.push(right);
 const headers=['M.','ZAWODNIK',...data.rounds.map((_,i)=>'T'+(i+1)),'SUMA','WAGA'];
 const top=285,headH=50,rowH=61,rowsBottom=top+headH+MT21_OVERALL_PAGE_SIZE*rowH;
 ctx.fillStyle=dark;ctx.fillRect(25,top,1029,headH);
 headers.forEach((lab,i)=>tx(lab,(x[i]+(x[i+1]||right))/2,top+32,i>=2?19:21,620,'#fff','center',Math.max(25,(x[i+1]||right)-x[i]-10)));
 for(let j=0;j<MT21_OVERALL_PAGE_SIZE;j++){
  const r=data.shown[j],yy=top+headH+j*rowH;
  ctx.fillStyle=j%2?'#f3f4f5':'#fff';ctx.fillRect(25,yy,1029,rowH);
  if(!r)continue;
  tx(r.rank??'—',x[0]+8,yy+40,24,670,orange);
  tx(String(r.competitorName||'').toUpperCase(),x[1]+9,yy+40,24,510,dark,'left',x[2]-x[1]-16);
  data.rounds.forEach((tour,i)=>{
   const entry=cycle?(r.entries||[]).find(z=>String(z.tourId)===String(tour.id)):(r.results||[]).find(z=>z.round===i+1);
   tx(entry?fmt(entry.place):'—',x[2+i]+tourW/2,yy+40,21,530,dark,'center');
  });
  tx(fmt(cycle?r.pointSum:r.points),x[x.length-3]+sumWidth/2,yy+40,23,660,orange,'center');
  tx(weightText(r.weightG),right-11,yy+40,21,610,dark,'right');
 }
 ctx.save();ctx.lineWidth=1.6;ctx.strokeStyle=border;ctx.beginPath();
 x.forEach(xx=>{ctx.moveTo(xx,top);ctx.lineTo(xx,rowsBottom)});
 for(let k=0;k<=MT21_OVERALL_PAGE_SIZE;k++){const yy=top+headH+k*rowH;ctx.moveTo(25,yy);ctx.lineTo(right,yy)}
 ctx.moveTo(25,top);ctx.lineTo(right,top);ctx.stroke();ctx.restore();
 ctx.fillStyle=dark;ctx.fillRect(9,1303,1062,37);
 tx('MATCH THIS · KLASYFIKACJA',35,1328,17,500,'#eceef0');tx(`${data.page+1}/${data.pageCount}`,1040,1328,17,500,'#eceef0','right');
 ctx.strokeStyle=border;ctx.lineWidth=2;ctx.strokeRect(6,6,1068,1338);
}

function eventTable(event){try{
 const res=core.eventClassification(event);

 }catch(err){return `<section class="panel"><div class="notice">${safeName(err.message)}</div></section>`}}
function tourTable(tour){try{const ranked=core.tourClassification(tour).filter(r=>!core.isNonStarter(r));const sectors=[...new Set(ranked.map(x=>x.sector).filter(s=>s&&s!=='—'))].sort((a,b)=>a.localeCompare(b,'pl'));return `<div class="panel"><h2>Klasyfikacja tury — ${safeName(tour.name)}</h2><p class="sub">${tour.status==='FINAL'?'Zatwierdzona':'Robocza — nie liczy się jeszcze do cyklu'}</p><div class="row noprint" style="margin-bottom:8px"><button class="btn small secondary" data-action="pdfAllSectors" ${sectors.length?'':'disabled'}>PDF — wszystkie sektory A4</button>${sectors.map(sector=>`<button class="btn small secondary" data-pdf-sector="${escapeHtml(sector)}">PDF sektor ${safeName(sector)}</button>`).join('')}</div>${tableRows(ranked,[["Sektor",x=>safeName(x.sector)],["Punkty / miejsce",x=>fmt(x.place)],["Zawodnik",x=>safeName(x.competitorName)],["Stanowisko",x=>x.peg??'—'],["Waga (g)",x=>weightText(x.weightG)]])}</div>`}catch(e){return `<div class="notice">${safeName(e.message)}</div>`}}

function editorRowHtml(row={},isFinal=false,withOfficial=false){

 return `<tr data-result-row data-competitor-id="${escapeHtml(row.competitorId||'')}" data-original-name="${escapeHtml(name)}" class="${row.nameNeedsReview?'row-needs-review':''}">
   <td><input aria-label="Zawodnik" name="competitorName" list="resultNames" placeholder="Nazwisko Imię" value="${escapeHtml(name)}" ${isFinal?'disabled':''} required></td>

   <td><input aria-label="Stanowisko" name="peg" type="number" min="1" max="9999" step="1" placeholder="—" value="${escapeHtml(peg)}" ${isFinal?'disabled':''}></td>
   <td><input aria-label="Waga w gramach" name="weightG" type="number" min="0" step="1" placeholder="g" value="${escapeHtml(weight)}" ${isFinal?'disabled':''} required></td>
   ${withOfficial?`<td><input aria-label="Oficjalne punkty" name="officialPlace" type="number" min="0" max="100" step="0.5" placeholder="—" value="${escapeHtml(points)}" ${isFinal?'disabled':''}></td>`:''}
   <td class="noprint"><button class="row-delete" type="button" data-action="removeResultRow" aria-label="Usuń wiersz" ${isFinal?'disabled':''}>×</button>${row.nameNeedsReview?'<small class="review-name" title="Zapis nazwiska wymaga kontroli z fotografią">Sprawdź nazwisko</small>':''}</td></tr>`
}
function renderResultsEditor(t){
 const locked=t.status==='FINAL',official=!!t.sourceOfficial;
 const people=db.players.filter(p=>!p.archived).sort((a,b)=>String(a.lastName||'').localeCompare(b.lastName||'','pl'));
 const list=people.map(p=>`<option value="${escapeHtml(fullName(p))}"></option>`).join('');
 return `<div class="results-editor"><p class="sub">Wpisuj wyniki bezpośrednio w tabeli. Wartości w gramach, stanowiska i sektory zapisują się po kliknięciu <b>Zapisz wyniki</b>. Wiersze ze źródeł archiwalnych, których nazwiska wymagają kontroli, są oznaczone.</p>
 <datalist id="resultNames">${list}</datalist><div class="tablewrap results-scroll"><table class="result-edit-table"><thead><tr><th>Zawodnik</th><th>Sektor</th><th>Stanowisko</th><th>Waga (g)</th>${official?'<th>Punkty oficjalne</th>':''}<th class="noprint">Akcja</th></tr></thead>
 <tbody id="resultRows">${(t.results.length?t.results:[{}]).map(r=>editorRowHtml(r,locked,official)).join('')}</tbody></table></div>
 <div class="row noprint editor-actions"><button class="btn small secondary" data-action="addResultRow" ${locked?'disabled':''}>+ Dodaj zawodnika</button><button class="btn small" data-action="saveRound" ${locked?'disabled':''}>Zapisz wyniki</button><button class="btn small secondary" data-action="finalize" ${locked?'disabled':''}>Zatwierdź turę</button><button class="btn small secondary" data-action="reopen" ${!locked?'disabled':''}>Otwórz do poprawki</button></div>
 <details class="technical-import noprint"><summary>Zaawansowane: import wielu wierszy (CSV ze średnikami)</summary><p class="smallprint">Opcja dodatkowa do wklejania dużych tabel. Nie jest potrzebna do codziennej pracy.</p><textarea id="resultsText" spellcheck="false" rows="4" placeholder="Nazwisko Imię;A;1;14500${official?';1':''}">${escapeHtml(t.results.map(r=>[r.competitorName,r.sector||'',r.peg??'',r.weightG,...(official?[r.officialPlace??'']:[])].join(';')).join('\n'))}</textarea><div class="row"><button class="btn small secondary" data-action="applyLegacyRows" ${locked?'disabled':''}>Przenieś do tabeli</button></div></details></div>`;
}
function setEditorRows(rows){const t=getRounds(current())[roundIndex],tbody=document.getElementById('resultRows');tbody.innerHTML=(rows.length?rows:[{}]).map(r=>editorRowHtml(r,false,!!t.sourceOfficial)).join('')}
function parseTableRows(){
 const trs=[...document.querySelectorAll('#resultRows tr[data-result-row]')],out=[],seen=new Set();
 for(const [i,tr] of trs.entries()){
  const val=k=>tr.querySelector(`[name="${k}"]`)?.value.trim()||'';
  const name=val('competitorName');if(!name&&!val('sector')&&!val('peg')&&!val('weightG'))continue;
  if(!name)throw Error(`Wiersz ${i+1}: uzupełnij nazwisko i imię`);
  const sector=val('sector').toUpperCase()||null,peg=val('peg'),weight=val('weightG'),official=val('officialPlace');
  if(weight==='')throw Error(`Wiersz ${i+1}: podaj wagę w gramach (także 0)`);
  if(!sector&&!official)throw Error(`Wiersz ${i+1}: podaj sektor lub oficjalne punkty`);
  const originalId=tr.dataset.competitorId, unchanged=norm(name)===norm(tr.dataset.originalName);
  const competitorId=unchanged&&originalId?originalId:resolveCompetitor(name);
  const key=String(competitorId);if(seen.has(key))throw Error(`Powtórzony zawodnik w turze: ${name}`);seen.add(key);
  const row={competitorId,competitorName:name,sector,peg:peg===''?null:Number(peg),weightG:Number(weight)};
  if(official!==''){row.officialPlace=Number(official.replace(',','.'));row.absent=row.officialPlace===100&&row.weightG===0;}
  if(tr.classList.contains('row-needs-review')&&unchanged)row.nameNeedsReview=true;
  out.push(row);
 }
 return out;
}
function toggleDrawPublication(){
 const e=current(),t=getRounds(e)[roundIndex];if(!e||!t)throw Error('Nie wybrano tury');
 const date=t.date||e.date||'',today=new Date().toLocaleDateString('sv-SE');
 const future=date?date>=today:Number(e.year)>new Date().getFullYear();
 if(t.drawPublished){t.drawPublished=false;save();render();alertMsg('Ukryto losowanie przed odbiorcami',true);return;}
 if(e.archived||!future)throw Error('Losowania archiwalne i minione pozostają niepubliczne');
 if(!t.results?.length||!t.results.every(r=>r.competitorName&&Number.isInteger(r.peg)&&r.peg>0))throw Error('Najpierw zapisz komplet stanowisk i nazwisk');
 t.drawPublished=true;save();render();alertMsg('Zapisano zgodę na publikację losowania. W tej wersji działa tylko lokalny podgląd; serwer nie jest podłączony.',true);
}
function previewPublishedDraw(){
 const e=current(),t=getRounds(e)[roundIndex];if(!t.drawPublished||e.archived||((t.date||e.date||'')&&((t.date||e.date)<new Date().toLocaleDateString('sv-SE'))))throw Error('Losowanie jest niepubliczne');
 const rows=t.results.slice().sort((a,b)=>(a.sector||'').localeCompare(b.sector||'')||(a.peg||0)-(b.peg||0));
 const html=`<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>MatchThis ${APP_VERSION} — Losowanie ${safeName(e.name)}</title><style>body{font:14px Arial,sans-serif;max-width:900px;margin:35px auto;color:#2c2e35}header{border-bottom:4px solid #e96609;padding-bottom:14px}h1{font-size:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:9px;text-align:left}th{background:#eee}b{color:#e96609}@media print{button{display:none}}</style></head><body><header><h1>Match<b>This</b> · Losowanie stanowisk</h1><h2>${safeName(e.name)} — ${safeName(t.name)}</h2><p>Data: ${safeName(t.date||e.date||'—')} · Opublikowane w lokalnym podglądzie</p></header><button onclick="print()">Drukuj / PDF</button><table><thead><tr><th>Sektor</th><th>Stanowisko</th><th>Zawodnik</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${safeName(r.sector||'—')}</td><td>${r.peg}</td><td>${safeName(r.competitorName)}</td></tr>`).join('')}</tbody></table></body></html>`;
 const popup=window.open('','_blank');if(!popup)throw Error('Odblokuj wyskakujące okna');popup.document.open();popup.document.write(html);popup.document.close();popup.focus();
}


function hasSectors(t){return (t?.results||[]).some(r=>r.sector&&r.sector!=='—');}
function roundDefaultMode(e,i){return hasSectors(getRounds(e)[i])?'sectors':'round';}
function isFutureDraw(e,t){const date=t.date||e.date||'',today=new Date().toLocaleDateString('sv-SE');return !e.archived&&(date?date>=today:Number(e.year)>new Date().getFullYear());}
function readableResultsTable(rows,isSector=false){
 const cls=isSector?'sector-result':'round-result';
 if(!rows.length)return '<p class="sub">Brak wpisanych wyników dla tego widoku.</p>';
 const sorted=rows.slice().sort((a,b)=>Number(a.place)-Number(b.place)||Number(b.weightG)-Number(a.weightG)||String(a.competitorName).localeCompare(String(b.competitorName),'pl'));
 return `<div class="tablewrap"><table class="${cls} match-results"><thead><tr><th>Sektor</th><th title="Punkty sektorowe">Pkt. sekt.</th><th class="name-column">Zawodnik</th><th>Stan.</th><th>Waga (g)</th></tr></thead><tbody>${sorted.map(r=>`<tr><td class="sector-cell" data-label="Sektor">${safeName(r.sector||'—')}</td><td class="points-cell" data-label="Punkty sektorowe">${fmt(Number(r.place))}</td><td class="name-cell">${safeName(r.competitorName||r.competitorId||'—')}${r.nameNeedsReview?'<small class="review-name">Do sprawdzenia</small>':''}</td><td class="peg-cell">${r.peg??'—'}</td><td class="weight weight-value">${weightText(r.weightG)}</td></tr>`).join('')}</tbody></table></div>`;
}

 const reviewCount=rounds.reduce((n,r)=>n+(r.results||[]).filter(x=>x.nameNeedsReview).length,0);
 const overall=resultMode==='overall'||resultMode==='photoOverall';const canDraw=isFutureDraw(e,t);

function render(){if(roleMode==='viewer'&&adminOnlyViews.has(page))page='home';if(roleMode==='viewer'&&adminOnlyModes.has(resultMode))resultMode='sectors';document.body.dataset.role=roleMode;document.body.classList.toggle('detail-page',page==='event'||page==='cycle');renderNav();renderFinalsSide();let html='';if(page==='home')html=renderHome();else if(page==='newCycle')html=formNewCycle();else if(page==='newEvent')html=formNewEvent();else if(page==='archive')html=renderArchive();else if(page==='cycles')html=renderCyclesIndex();else if(page==='events')html=renderEventsIndex();else if(page==='photoHub')html=renderPhotoHub();else if(page==='players')html=renderPlayers();else if(page==='profile')html=renderPlayerProfile();else {const e=current();html=e?renderEntity(e):'<div class="notice">Brak wybranych zawodów.</div>';}document.getElementById('main').innerHTML=html;if((resultMode==='photo'&&(page==='cycle'||page==='event'))||page==='photoHub')drawFbPreview();if(resultMode==='photoOverall'&&(page==='cycle'||page==='event'))drawOverallFbPreview();document.title='MatchThis '+APP_VERSION;}
function parseRows(text){return String(text).split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map((line,i)=>{const a=line.split(';').map(x=>x.trim());if(![4,5].includes(a.length)||!a[0]||(a.length===4&&!a[1]))throw new Error('Wiersz '+(i+1)+': oczekiwane 4 lub 5 pól (punkty oficjalne jako piąte)');const peg=a[2]?Number(a[2]):null;const out={competitorId:resolveCompetitor(a[0]),competitorName:a[0],sector:a[1].toUpperCase()||null,peg,weightG:Number(a[3])};if(a.length===5){out.officialPlace=Number(a[4].replace(',','.'));out.absent=out.officialPlace===100&&out.weightG===0;}return out})}
function saveRound(){const e=current(),t=getRounds(e)[roundIndex];if(t.status==='FINAL')throw new Error('Najpierw otwórz zatwierdzoną turę do korekty');const results=parseTableRows();const sourceOfficial=results.some(x=>x.officialPlace!==undefined);core.validateTour({...t,sourceOfficial,results});t.results=results;t.sourceOfficial=sourceOfficial;t.drawPublished=false;if(e.officialRows)e.officialDataEdited=true;save();render();alertMsg('Wyniki zapisane w przeglądarce',true)}
function finalize(){const e=current(),t=getRounds(e)[roundIndex];if(!t.results.length)throw new Error('Brak zapisanych wyników');core.validateTour(t);t.status='FINAL';save();render();alertMsg('Tura zatwierdzona i uwzględniona w tabeli',true)}
function reopen(){const t=getRounds(current())[roundIndex];t.status='DRAFT';save();render();alertMsg('Tura otwarta do korekty',true)}
function parsePegs(){const text=document.getElementById('pegs').value.trim();if(/^\d+\s*-\s*\d+$/.test(text)){const [a,b]=text.split('-').map(Number);if(b-a>200||a<1||b<a)throw new Error('Niepoprawny zakres stanowisk');return Array.from({length:b-a+1},(_,i)=>a+i);}return text.split(',').map(x=>Number(x.trim()));}
function draw(){const e=current(),t=getRounds(e)[roundIndex],nameLines=document.getElementById('rosterText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(t.status==='FINAL')throw new Error('Tura jest zatwierdzona');if(!nameLines.length)throw new Error('Podaj zawodników do losowania');const pegs=parsePegs(),sectors=Number(document.getElementById('sectors').value);const groups=core.sectorsFromPegs(pegs,sectors),sectorByPeg=new Map(groups.flatMap(g=>g.pegs.map(peg=>[peg,g.sector])));const history=getRounds(e).filter((_,i)=>i!==roundIndex).flatMap(t=>t.results);const drawn=core.drawStations(nameLines.map(n=>({competitorId:resolveCompetitor(n),competitorName:n})),pegs,history);setEditorRows(drawn.map(x=>({...x,sector:sectorByPeg.get(x.peg),weightG:0})));t.drawPublished=false;save();document.getElementById('drawInfo').textContent='Stanowiska przygotowane w tabeli. Wpisz wagi i zapisz wyniki. Losowanie nie jest publikowane automatycznie.';alertMsg('Losowanie przygotowane; nieopublikowane',true)}
function divide(){const info=core.sectorsFromPegs(parsePegs(),Number(document.getElementById('sectors').value));document.getElementById('drawInfo').textContent=info.map(x=>x.sector+': '+x.pegs.join(', ')).join(' | ')}

function buildSectorPrintHtml(entity,tour,requestedSector=null){
  core.validateTour(tour);
  const ranked=core.tourClassification(tour).filter(r=>!core.isNonStarter(r));
  if(!ranked.length)throw new Error('Nie ma wyników do wydruku');
  const sectors=[...new Set(ranked.map(r=>r.sector).filter(s=>s&&s!=='—'))].sort((a,b)=>a.localeCompare(b,'pl'));
  const chosen=requestedSector===null?sectors:sectors.filter(sector=>sector===requestedSector);
  if(!chosen.length)throw new Error('Nie znaleziono sektora: '+requestedSector);
  const needsReview=(tour.results||[]).some(r=>r.nameNeedsReview);
  const sheet=sector=>{
    const rows=ranked.filter(r=>r.sector===sector).sort((a,b)=>a.place-b.place||b.weightG-a.weightG);
    return `<section class="sheet ${rows.length>42?'ultradense':rows.length>24?'dense':''}"><div class="mast"><div class="brandprint">MATCH <b>THIS</b></div><span>${safeName(entity.year)} · ${needsReview?'WYNIKI ARCHIWALNE — DO WERYFIKACJI':tour.status==='FINAL'?'WYNIKI OFICJALNE':'WYNIKI ROBOCZE'}</span></div>
     <h1>${safeName(entity.name)}</h1><div class="meta">${safeName(tour.name)} · Sektor <strong>${safeName(sector)}</strong> · ${rows.length} zawodników</div>
     <table><thead><tr><th style="width:10%">Miejsce</th><th style="width:15%">Stanowisko</th><th>Zawodnik</th><th style="width:18%;text-align:center">Waga (g)</th></tr></thead>
     <tbody>${rows.map(r=>`<tr><td class="place">${fmt(r.place)}</td><td>${r.peg??'—'}</td><td class="name">${safeName(r.competitorName||r.competitorId)}</td><td style="text-align:right">${weightText(r.weightG)}</td></tr>`).join('')}</tbody></table>
     <footer>MatchThis · ${safeName(entity.year)} · ${safeName(tour.name)} · Sektor ${safeName(sector)}<small>Jeden sektor na osobnej stronie A4 · wydruk wektorowy</small></footer></section>`;
  };
  return `<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MatchThis ${APP_VERSION} · ${safeName(entity.name)} · ${requestedSector===null?'Sektory':('Sektor '+safeName(requestedSector))}</title>
<style>@page{size:A4 portrait;margin:12mm}*{box-sizing:border-box}body{margin:0;color:#182123;font:12px/1.35 Arial,'DejaVu Sans',sans-serif;background:#fff}.controls{padding:10px;background:#eff3f3;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.controls button{border:0;border-radius:4px;padding:9px 14px;background:#142e33;color:#fff;cursor:pointer;font-weight:bold}.controls p{margin:0;color:#344}.sheet{padding:0;min-height:268mm;break-after:page;page-break-after:always;display:flex;flex-direction:column}.sheet:last-child{break-after:auto;page-break-after:auto}.mast{border-bottom:3px solid #e96609;padding:3mm 0;display:flex;align-items:center;justify-content:space-between;font-size:19px;font-weight:900;letter-spacing:-.06em}.mast .brandprint{font-weight:900;letter-spacing:-.06em}.mast b{color:#e96609}.mast span{letter-spacing:0;font-size:10px;font-weight:600;color:#596}.meta{font-size:13px;margin:5mm 0}.meta strong{font-size:17px}h1{font-size:19px;margin:5mm 0 0}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}th{background:#e7ebec;text-align:center;font-size:10px;text-transform:uppercase}td,th{padding:6px 7px;border:1px solid #b8c4c7;overflow-wrap:anywhere}tbody tr{break-inside:avoid;page-break-inside:avoid}tbody tr:nth-child(even){background:#f8f9f9}.dense table{font-size:11px}.dense td,.dense th{padding:3px 5px}.ultradense table{font-size:9px;line-height:1.12}.ultradense td,.ultradense th{padding:1px 4px}.place{font-weight:bold}.name{font-weight:600}footer{margin-top:auto;border-top:1px solid #b6c6c7;color:#4e5e5f;padding-top:3mm;font-size:10px;display:flex;justify-content:space-between;gap:6mm}footer small{font-size:9px}@media print{.controls{display:none!important}.sheet{min-height:267mm}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="controls"><button onclick="window.print()">Drukuj / zapisz jako PDF</button><p>${chosen.length===1?'Sektor '+safeName(chosen[0]):'Wszystkie sektory'} — każdy sektor na osobnej stronie A4. Wybierz drukarkę „Zapisz jako PDF”.</p></div>${chosen.map(sheet).join('')}</body></html>`;
}
function downloadBlob(blob,filename){requireAdmin();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;link.style.display='none';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function safeFilePart(text){return String(text||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,55)||'wyniki'}
function exportSectorPdf(sector=null){requireAdmin();const entity=current();if(!entity)throw Error('Nie otwarto zawodów');const tour=getRounds(entity)[roundIndex];const ranked=core.tourClassification(tour).filter(r=>!core.isNonStarter(r));const pdf=MatchThisVectorPdf.create({entity,tour,sector,ranked});const suffix=sector===null?'WSZYSTKIE_SEKTORY':'SEKTOR_'+safeFilePart(sector);downloadBlob(new Blob([pdf],{type:'application/pdf'}),`MatchThis_${safeFilePart(entity.name)}_${safeFilePart(tour.name)}_${suffix}.pdf`);}
function openSectorPrint(sector=null){requireAdmin();exportSectorPdf(sector);}
function fbSectorResults(){
 if(page==='photoHub'){
  const selection=getPhotoSelection();
  if(!selection)throw Error('Brak potwierdzonych wyników sektorowych');
  const {entity,chosenRound,sector,sectors}=selection;
  const tour=chosenRound.tour,ranked=core.tourClassification(tour).filter(r=>!core.isNonStarter(r));
  return {entity,tour,ranked,sector,sectors};
 }
 const entity=current();if(!entity)throw Error('Nie wybrano zawodów');
 const tour=getRounds(entity)[roundIndex];
 const ranked=core.tourClassification(tour).filter(r=>!core.isNonStarter(r));
 const sectors=[...new Set(ranked.map(r=>r.sector).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
 if(!sectors.length)throw Error('Brak potwierdzonych przypisań sektorów');
 const sector=selectedSector!=='ALL'&&sectors.includes(selectedSector)?selectedSector:sectors[0];
 return {entity,tour,ranked,sector,sectors};
}
function drawFbPreview(){requireAdmin();const canvas=document.getElementById('fbCanvas');if(!canvas)return;try{MatchThisFbPhoto.draw(canvas,fbSectorResults());}catch(err){document.getElementById('fbPreviewStatus').textContent=err.message;}}
function downloadFbPhoto(){requireAdmin();const canvas=document.getElementById('fbCanvas');if(!canvas)throw Error('Najpierw wybierz widok FOTO FB');const {entity,tour,sector,ranked}=fbSectorResults();MatchThisFbPhoto.draw(canvas,{entity,tour,sector,ranked});canvas.toBlob(blob=>{if(!blob){alertMsg('Nie udało się wygenerować JPG');return;}downloadBlob(blob,`MatchThis_${safeFilePart(entity.name)}_${safeFilePart(tour.name)}_SEKTOR_${safeFilePart(sector)}_FB.jpg`);},'image/jpeg',.98);}
function downloadHubPdf(){requireAdmin();const {entity,tour,sector,ranked}=fbSectorResults();const pdf=MatchThisVectorPdf.create({entity,tour,sector,ranked});downloadBlob(new Blob([pdf],{type:'application/pdf'}),`MatchThis_${safeFilePart(entity.name)}_${safeFilePart(tour.name)}_SEKTOR_${safeFilePart(sector)}.pdf`);}
function renderFbPhoto(e,t){const ranked=core.tourClassification(t).filter(r=>!core.isNonStarter(r));const sectors=[...new Set(ranked.map(r=>r.sector).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));if(!sectors.length)return `<section class="panel"><h2>FOTO FB — ${safeName(t.name)}</h2><div class="notice">Brak źródłowych przypisań sektorów tej tury. Nie tworzymy fikcyjnych zdjęć.</div></section>`;if(selectedSector!=='ALL'&&!sectors.includes(selectedSector))selectedSector='ALL';const currentSector=selectedSector==='ALL'?sectors[0]:selectedSector;return `<section class="panel fb-panel"><div class="result-title"><h2>FOTO FB — ${safeName(t.name)}</h2><span class="pill">1 SEKTOR = 1 ZDJĘCIE</span></div><p class="sub">Pełne nazwiska, miejsce, stanowisko i waga. Kolorystyka MatchThis. Osobny plik JPG 1080 × 1350 px na każdy sektor.</p><div class="sector-choice noprint">${sectors.map(sector=>`<button class="${currentSector===sector?'active':''}" data-sector-filter="${escapeHtml(sector)}">SEKTOR ${safeName(sector)}</button>`).join('')}</div><div class="row noprint fb-actions"><button class="btn" data-action="downloadFbPhoto">Pobierz JPG — sektor ${safeName(currentSector)}</button><button class="btn secondary" data-pdf-sector="${escapeHtml(currentSector)}">Pobierz PDF wektorowy A4</button></div><div id="fbPreviewStatus" class="smallprint">Podgląd zdjęcia Facebook (4:5). PDF jest generowany oddzielnie, bez pikseli.</div><div class="fb-canvas-wrap"><canvas id="fbCanvas" width="1080" height="1350" aria-label="Podgląd zdjęcia wyników sektora"></canvas></div></section>`;}

function exportData(){requireAdmin();const data=JSON.stringify({format:'matchthis-integration-preview-1',data:db},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='MatchThis_MT-23_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function loadData(data){requireAdmin();if(!data||data.format!=='matchthis-integration-preview-1'||!data.data||!Array.isArray(data.data.cycles)||!Array.isArray(data.data.events))throw new Error('To nie jest poprawna kopia podglądu MatchThis');data.data.cycles.forEach(x=>core.cycleClassification(x));data.data.events.forEach(x=>core.eventClassification(x));const r=mergeDatabase(data.data);selectedPlayerIds.clear();page='home';selectedId=null;render();alertMsg('Import scalony bez nadpisywania: '+r.playersAdded+' zawodników, '+r.cyclesAdded+' cykli, '+r.eventsAdded+' zawodów',true)}
document.addEventListener('submit',e=>{try{requireAdmin();if(e.target.id==='createCycle')formCycle(e);if(e.target.id==='createEvent')formEvent(e);if(e.target.id==='playerForm')formPlayer(e)}catch(err){e.preventDefault();alertMsg(err.message)}});
document.addEventListener('input',e=>{if(e.target.id==='playerSearch'){playerFilter=e.target.value;const caret=e.target.selectionStart;render();const box=document.getElementById('playerSearch');box?.focus();box?.setSelectionRange(caret,caret)}});
document.addEventListener('change',e=>{if(e.target.id==='roleMode'){setRoleMode(e.target.value);return}if(e.target.id==='fbEntity'){photoEntityId=e.target.value;photoRoundIndex=0;photoSector='ALL';render();return}if(e.target.id==='fbRound'){photoRoundIndex=Number(e.target.value);photoSector='ALL';render();return}if(e.target.id==='fbSector'){photoSector=e.target.value;render();return}if(roleMode==='viewer'&&(e.target.id==='rosterTarget'||e.target.matches('[data-player-check]'))){e.preventDefault();return}if(e.target.id==='rosterTarget'){rosterTarget=e.target.value;render();return}if(e.target.id==='includeArchivedPlayers'){includeArchivedPlayers=e.target.checked;render();return}if(e.target.matches('[data-player-check]')){const id=e.target.dataset.playerCheck;if(e.target.checked)selectedPlayerIds.add(id);else selectedPlayerIds.delete(id);render();}});
document.addEventListener('click',e=>{const fold=e.target.closest('summary');if(fold?.parentElement?.matches('.year-fold'))expandedYear=Number(fold.parentElement.dataset.year)||2026;},true);
document.addEventListener('click',e=>{const edit=e.target.closest('[data-profile-player],[data-edit-player],[data-archive-player],[data-restore-player],[data-remove-entrant]');if(edit){try{if(roleMode==='viewer'&&!edit.dataset.profilePlayer)requireAdmin();if(edit.dataset.profilePlayer){profilePlayerId=edit.dataset.profilePlayer;page='profile';render();return}if(edit.dataset.restorePlayer){const p=findPlayer(edit.dataset.restorePlayer);if(p){p.archived=false;save();render();alertMsg('Przywrócono zawodnika; historia pozostała bez zmian',true)}return}if(edit.dataset.editPlayer){editingPlayerId=edit.dataset.editPlayer;render();return}if(edit.dataset.archivePlayer){const p=findPlayer(edit.dataset.archivePlayer);if(!p)throw new Error('Nie znaleziono osoby');p.archived=true;selectedPlayerIds.delete(p.id);save();render();alertMsg('Zarchiwizowano zawodnika; historia wyników pozostaje',true);return}if(edit.dataset.removeEntrant){removeEntrant(edit.dataset.removeEntrant);return}}catch(err){alertMsg(err.message)}return}
 const b=e.target.closest('[data-view],[data-open],[data-round],[data-result-mode],[data-sector-filter],[data-action],[data-pdf-sector],[data-overall-photo-page]');if(!b)return;try{if(roleMode==='viewer' && (b.dataset.action!==undefined || b.dataset.pdfSector!==undefined || b.dataset.overallPhotoPage!==undefined))requireAdmin();if(b.dataset.overallPhotoPage!==undefined){overallPhotoPage=Number(b.dataset.overallPhotoPage);render();return;}if(b.dataset.pdfSector!==undefined){openSectorPrint(b.dataset.pdfSector);return;}if(b.dataset.view){if(adminOnlyViews.has(b.dataset.view)||(roleMode==='viewer'&&!viewerAllowedViews.has(b.dataset.view)))requireAdmin();page=b.dataset.view;roundIndex=0;selectedId=null;resultMode='sectors';selectedSector='ALL';render();return}if(b.dataset.open){page=b.dataset.type;selectedId=b.dataset.open;roundIndex=0;resultMode=roundDefaultMode(current(),0);selectedSector='ALL';render();return}if(b.dataset.round!==undefined){roundIndex=Number(b.dataset.round);resultMode=roundDefaultMode(current(),roundIndex);selectedSector='ALL';render();return}if(b.dataset.resultMode){if(adminOnlyModes.has(b.dataset.resultMode)||(roleMode==='viewer'&&!viewerAllowedModes.has(b.dataset.resultMode)))requireAdmin();resultMode=b.dataset.resultMode;selectedSector='ALL';render();return}if(b.dataset.sectorFilter){selectedSector=b.dataset.sectorFilter;render();return}if(adminOnlyActions.has(b.dataset.action))requireAdmin();switch(b.dataset.action){case 'saveRound':saveRound();break;case 'addResultRow':{const t=getRounds(current())[roundIndex];if(t.status==='FINAL')throw Error('Najpierw otwórz turę');document.getElementById('resultRows').insertAdjacentHTML('beforeend',editorRowHtml({},false,!!t.sourceOfficial));break}case 'removeResultRow':{b.closest('tr[data-result-row]')?.remove();break}case 'applyLegacyRows':{const rows=parseRows(document.getElementById('resultsText').value);setEditorRows(rows);alertMsg('Przeniesiono do tabeli; kliknij Zapisz wyniki',true);break}case 'toggleDrawPublication':toggleDrawPublication();break;case 'previewDraw':previewPublishedDraw();break;case 'finalize':finalize();break;case 'reopen':reopen();break;case 'archive':{const entity=current();entity.archived=!entity.archived;save();render();alertMsg(entity.archived?'Zapisano w archiwum':'Przywrócono do aktywnych',true);break}case 'draw':draw();break;case 'saveTourDate':saveTourDate();break;case 'choosePlayers':{rosterTarget=selectedId;page='players';render();break}case 'selectVisible':{filteredPlayers().forEach(p=>selectedPlayerIds.add(p.id));render();break}case 'unselectVisible':{filteredPlayers().forEach(p=>selectedPlayerIds.delete(p.id));render();break}case 'applyRoster':saveSelectedRoster();break;case 'cancelPlayerEdit':editingPlayerId=null;render();break;case 'divide':divide();break;case 'export':exportData();break;case 'mergeHistoric2026':mergeHistoric2026();break;case 'pdfAllSectors':openSectorPrint();break;case 'downloadFbPhoto':downloadFbPhoto();break;case 'downloadOverallFbPhoto':downloadOverallFbPhoto();break;case 'downloadHubPdf':downloadHubPdf();break;case 'print':window.print();break}}catch(err){alertMsg(err.message)}});
document.getElementById('import').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{requireAdmin();loadData(JSON.parse(await f.text()))}catch(err){alertMsg(err.message)}finally{e.target.value=''}});
render();
